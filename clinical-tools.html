<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Prime Hospital - Clinical Tools</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>*{box-sizing:border-box}body{font:14px Arial;margin:0;background:#f4f7fb;color:#172033}.wrap{max-width:1100px;margin:20px auto;padding:20px;background:#fff;border-radius:12px}.top{display:flex;justify-content:space-between;align-items:center;gap:12px}.brand{color:#123d88;font-size:26px;font-weight:700;text-decoration:none}.btn{padding:9px 13px;border-radius:7px;border:1px solid #123d88;background:#fff;color:#123d88;font-weight:bold;cursor:pointer}.primary{background:#123d88;color:#fff}.danger{color:#b42318;border-color:#b42318}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.card{border:1px solid #dfe5ee;border-radius:10px;padding:15px;margin-top:14px}.input{width:100%;padding:10px;border:1px solid #cfd7e3;border-radius:7px}.row{border:1px solid #e1e6ed;border-radius:8px;padding:11px;margin:7px 0;display:flex;justify-content:space-between;gap:10px;align-items:center}.muted{color:#667085;font-size:12px}.visit{border-left:3px solid #123d88;padding:9px 12px;margin:10px 0;background:#f8fbff}.actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:8px}@media(max-width:700px){.grid{grid-template-columns:1fr}.top{align-items:flex-start;flex-direction:column}.row{display:block}.row .actions{margin-top:8px}}</style></head><body><main class="wrap"><div class="top"><a class="brand" href="/">PRIME HOSPITAL</a><div class="actions"><a class="btn" href="/">Home</a><a class="btn primary" href="/app-v2.html">New Consultation</a></div></div><p class="muted">Clinical workflow tools — follow-up, repeat prescription, medicine management and backup.</p><div class="card"><h2>Patient Follow-up</h2><input id="pq" class="input" placeholder="Search patient by any part of name, mobile or UHID" oninput="searchPatients()"><div id="patients"></div><div id="history"></div></div><div class="grid"><div class="card"><h2>Medicine Library</h2><input id="mq" class="input" placeholder="Search any word, strength or formulation" oninput="loadMeds()"><div id="meds"></div></div><div class="card"><h2>Data Backup</h2><p class="muted">Downloads your clinical data as JSON. This does not delete or modify cloud records.</p><button class="btn primary" onclick="backup()">Download Full Backup</button><p id="backupMsg" class="muted"></p></div></div></main><script>const sb=supabase.createClient('https://prcvzefynoiuneybufge.supabase.co','sb_publishable_JbxZuf181uR8zbmTyyfFiA_2pLjsq0C');const $=id=>document.getElementById(id);let currentPatient=null;const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));async function user(){let r=await sb.auth.getUser();if(!r.data.user){location.href='/app-v2.html';return null}return r.data.user}async function searchPatients(){let u=await user();if(!u)return;let q=$('pq').value.trim();if(!q){$('patients').innerHTML='';return}let {data,error}=await sb.from('patients').select('*').eq('doctor_id',u.id).or(`name.ilike.%${q}%,mobile.ilike.%${q}%,patient_id.ilike.%${q}%`).order('name').limit(20);if(error){$('patients').textContent=error.message;return}$('patients').innerHTML=(data||[]).map(p=>`<div class="row"><div><b>${esc(p.name)}</b><div class="muted">UHID ${esc(p.patient_id||'—')} • ${esc(p.mobile||'—')} • ${esc(p.age||'—')} • ${esc(p.gender||'')}</div></div><div class="actions"><button class="btn primary" onclick="showHistory('${p.id}')">History</button><button class="btn" onclick="startFollowup('${p.id}')">Start Follow-up</button></div></div>`).join('')||'<p class="muted">No patient found.</p>'}async function showHistory(id){let u=await user();if(!u)return;let p=(await sb.from('patients').select('*').eq('id',id).eq('doctor_id',u.id).single()).data;if(!p)return;currentPatient=p;let {data:vs,error}=await sb.from('visits').select('*').eq('patient_id',id).eq('doctor_id',u.id).order('visit_date',{ascending:false});if(error){$('history').textContent=error.message;return}let h=`<div class="card"><h3>${esc(p.name)} — ${esc(p.patient_id||'')}</h3><div class="muted">${esc(p.mobile||'')} • ${esc(p.age||'')} • ${esc(p.gender||'')}</div>`;(vs||[]).forEach((v,i)=>{h+=`<div class="visit"><b>${esc(v.visit_date||'—')}</b> ${i===0?'<b>• LATEST</b>':''}<br><b>Diagnosis:</b> ${esc(v.diagnosis||'—')}<br><b>Complaints:</b> ${esc(v.complaints||'—')}<br><b>Vitals:</b> ${esc(v.bp||'—')} • ${esc(v.pulse||'—')} • ${esc(v.spo2||'—')} • ${esc(v.weight||'—')} • ${esc(v.blood_sugar||'—')}<br><b>Advice:</b> ${esc(v.advice||'—')}<div class="actions"><button class="btn" onclick="repeatVisit('${v.id}')">Repeat This Prescription</button></div></div>`});h+='</div>';$('history').innerHTML=h}function startFollowup(id){sessionStorage.setItem('prime_followup_patient',id);location.href='/app-v2.html?followup='+encodeURIComponent(id)}async function repeatVisit(visitId){let u=await user();if(!u)return;let v=(await sb.from('visits').select('*').eq('id',visitId).eq('doctor_id',u.id).single()).data;if(!v)return;let {data:rx}=await sb.from('prescriptions').select('*').eq('visit_id',visitId).eq('doctor_id',u.id).order('sort_order');sessionStorage.setItem('prime_repeat_visit',JSON.stringify({visit:v,medicines:rx||[]}));location.href='/app-v2.html?repeat='+encodeURIComponent(visitId)}async function loadMeds(){let u=await user();if(!u)return;let q=$('mq').value.trim();let x=sb.from('medicines').select('*').eq('doctor_id',u.id).order('name').limit(100);if(q){let parts=q.split(/\s+/).filter(Boolean);for(const part of parts)x=x.or(`name.ilike.%${part}%,strength.ilike.%${part}%,default_frequency.ilike.%${part}%,default_duration.ilike.%${part}%,default_instruction.ilike.%${part}%`)}let {data,error}=await x;if(error){$('meds').textContent=error.message;return}$('meds').innerHTML=(data||[]).map(m=>`<div class="row"><div><b>${esc(m.name||'')}</b> ${esc(m.strength||'')}<div class="muted">${esc(m.default_frequency||'')} • ${esc(m.default_duration||'')} • ${esc(m.default_instruction||'')}</div></div><div class="actions"><button class="btn" onclick='editMed(${JSON.stringify(m)})'>Edit</button><button class="btn danger" onclick="deleteMed('${m.id}')">Delete</button></div></div>`).join('')||'<p class="muted">No medicines found.</p>'}async function editMed(m){let name=prompt('Medicine name',m.name||'');if(name===null)return;let strength=prompt('Formulation / strength',m.strength||'');if(strength===null)return;let freq=prompt('Timing / frequency',m.default_frequency||'');if(freq===null)return;let dur=prompt('Duration',m.default_duration||'');if(dur===null)return;let ins=prompt('Instruction',m.default_instruction||'');if(ins===null)return;let u=await user();if(!u)return;let r=await sb.from('medicines').update({name:name.trim(),strength:strength.trim(),default_frequency:freq.trim(),default_duration:dur.trim(),default_instruction:ins.trim()}).eq('id',m.id).eq('doctor_id',u.id);if(r.error)alert(r.error.message);else loadMeds()}async function deleteMed(id){if(!confirm('Delete this medicine from your library?'))return;let u=await user();if(!u)return;let r=await sb.from('medicines').delete().eq('id',id).eq('doctor_id',u.id);if(r.error)alert(r.error.message);else loadMeds()}async function backup(){let u=await user();if(!u)return;$('backupMsg').textContent='Preparing backup...';let tables=['patients','visits','prescriptions','medicines'];let out={backup_version:1,created_at:new Date().toISOString(),doctor_id:u.id};for(const t of tables){let {data,error}=await sb.from(t).select('*').eq('doctor_id',u.id);if(error){$('backupMsg').textContent='Backup failed: '+error.message;return}out[t]=data||[]}let blob=new Blob([JSON.stringify(out,null,2)],{type:'application/json'});let a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='prime-hospital-backup-'+new Date().toISOString().slice(0,10)+'.json';a.click();URL.revokeObjectURL(a.href);$('backupMsg').textContent='Backup downloaded successfully.'}user().then(()=>{loadMeds()})</script></body></html>
