<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Prime Hospital - Follow-up</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>*{box-sizing:border-box}body{font:14px Arial;margin:0;background:#f4f7fb;color:#172033}.wrap{max-width:900px;margin:20px auto;padding:20px;background:#fff;border-radius:12px}.top{display:flex;justify-content:space-between;align-items:center;gap:10px}.btn{padding:9px 13px;border-radius:6px;border:1px solid #123d88;background:#fff;color:#123d88;font-weight:bold;cursor:pointer;text-decoration:none}.primary{background:#123d88;color:#fff}.card{border:1px solid #dfe5ee;border-radius:9px;padding:15px;margin:12px 0}.patient{background:#eef4ff;border:1px solid #cbd9f5;border-radius:9px;padding:16px}.name{font-size:22px;font-weight:bold;color:#123d88}.grid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}.box{background:#f4f7fb;padding:10px;border-radius:6px}.muted{color:#667085;font-size:12px}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:15px}.med{padding:7px 0;border-bottom:1px solid #eee}@media(max-width:700px){.grid{grid-template-columns:1fr 1fr}.top{flex-direction:column;align-items:flex-start}}</style></head><body><main class="wrap"><div class="top"><div><h1 style="color:#123d88;margin:0">PRIME HOSPITAL</h1><div>Patient Follow-up</div></div><div><a class="btn" href="/patients.html">Patient History</a><a class="btn" href="/app-v2.html">New Consultation</a></div></div><div id="content" class="card">Loading...</div></main><script>const U='https://prcvzefynoiuneybufge.supabase.co',K='sb_publishable_JbxZuf181uR8zbmTyyfFiA_2pLjsq0C',sb=supabase.createClient(U,K),$=x=>document.getElementById(x),e=s=>String(s??'—').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));async function init(){let{data}=await sb.auth.getSession();if(!data.session){location.href='/app-v2.html';return}let pid=new URLSearchParams(location.search).get('patient_id');if(!pid){$('content').innerHTML='<b>No patient selected.</b><div class="actions"><a class="btn" href="/patients.html">Go to Patient History</a></div>';return}let user=data.session.user;let{data:p,error:pe}=await sb.from('patients').select('*').eq('id',pid).eq('doctor_id',user.id).single();if(pe){$('content').innerHTML='<p>'+e(pe.message)+'</p>';return}let{data:v,error:ve}=await sb.from('visits').select('*').eq('patient_id',pid).eq('doctor_id',user.id).order('visit_date',{ascending:false}).limit(1);if(ve){$('content').innerHTML='<p>'+e(ve.message)+'</p>';return}let last=(v||[])[0],meds=[];if(last){let r=await sb.from('prescriptions').select('*').eq('visit_id',last.id).order('sort_order');meds=r.data||[]}$('content').innerHTML=`<div class="patient"><div class="name">${e(p.name)}</div><div style="margin-top:6px"><b>UHID:</b> ${e(p.patient_id)} &nbsp; | &nbsp; <b>Age:</b> ${e(p.age)} &nbsp; | &nbsp; <b>Gender:</b> ${e(p.gender)} &nbsp; | &nbsp; <b>Mobile:</b> ${e(p.mobile)}</div></div>${last?`<div class="card"><h2 style="color:#123d88;margin-top:0">Last Visit — ${e(last.visit_date)}</h2><div class="grid"><div class="box"><span class="muted">BP</span><br><b>${e(last.bp)}</b></div><div class="box"><span class="muted">Pulse</span><br><b>${e(last.pulse)}</b></div><div class="box"><span class="muted">SpO₂</span><br><b>${e(last.spo2)}</b></div><div class="box"><span class="muted">Weight</span><br><b>${e(last.weight)}</b></div><div class="box"><span class="muted">Sugar</span><br><b>${e(last.blood_sugar)}</b></div></div><p><b>Complaints:</b> ${e(last.complaints)}</p><p><b>Diagnosis:</b> ${e(last.diagnosis)}</p><p><b>Advice:</b> ${e(last.advice)}</p><h3 style="color:#123d88">Previous Medicines</h3>${meds.length?meds.map(m=>`<div class="med"><b>${e(m.medicine_name)}</b> ${e(m.strength)} — ${e(m.frequency)}</div>`).join(''):'<div class="muted">No medicines recorded.</div>'}</div>`:'<div class="card"><p>No previous visit found. This will be the first consultation.</p></div>'}<div class="actions"><a class="btn primary" href="/new-visit.html?patient_id=${encodeURIComponent(p.id)}">Start Follow-up / New Visit</a><a class="btn" href="/patients.html">← Patient History</a></div>`}init();</script></body></html>
