<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Prime Hospital - Edit Patient</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>*{box-sizing:border-box}body{font:14px Arial;margin:0;background:#f4f7fb;color:#172033}.wrap{max-width:800px;margin:25px auto;padding:20px;background:#fff;border-radius:12px}.top{display:flex;justify-content:space-between;align-items:center;gap:10px}.btn{padding:10px 14px;border-radius:6px;border:1px solid #123d88;background:#fff;color:#123d88;font-weight:bold;cursor:pointer;text-decoration:none}.primary{background:#123d88;color:#fff}.fields{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:18px}.field label{display:block;font-weight:bold;font-size:12px;margin-bottom:5px}.field input,.field select{width:100%;padding:10px;border:1px solid #cfd7e3;border-radius:6px}.wide{grid-column:1/-1}.card{border:1px solid #dfe5ee;border-radius:9px;padding:18px;margin-top:18px}.uhid{background:#eef4ff;border:1px solid #cbd9f5;padding:12px;border-radius:8px}.error{color:#b42318}.success{color:#067647}@media(max-width:650px){.fields{grid-template-columns:1fr}.wide{grid-column:auto}.top{flex-direction:column;align-items:flex-start}}</style></head><body><main class="wrap"><div class="top"><div><h1 style="color:#123d88;margin:0">PRIME HOSPITAL</h1><div>Edit Patient Details</div></div><div><a class="btn" href="/dashboard.html">Dashboard</a><a class="btn" href="/patients.html">History</a></div></div><div id="status" class="card">Loading patient...</div><div id="formCard" class="card" style="display:none"><div class="uhid"><b>UHID:</b> <span id="uhid"></span><div style="margin-top:5px" class="muted">UHID cannot be changed, so all previous visits and prescriptions remain connected.</div></div><div class="fields"><div class="field wide"><label>Patient Name *</label><input id="name"></div><div class="field"><label>Age</label><input id="age" type="number" min="0" max="130"></div><div class="field"><label>Gender</label><select id="gender"><option value="Male">Male</option><option value="Female">Female</option><option value="Other">Other</option></select></div><div class="field"><label>Mobile</label><input id="mobile" inputmode="numeric" maxlength="15"></div></div><div style="margin-top:18px"><button class="btn primary" onclick="save()">Save Changes</button> <a class="btn" id="historyLink" href="/patients.html">Cancel</a></div></div></main><script>const SB_URL='https://prcvzefynoiuneybufge.supabase.co',SB_KEY='sb_publishable_JbxZuf181uR8zbmTyyfFiA_2pLjsq0C',sb=supabase.createClient(SB_URL,SB_KEY),$=x=>document.getElementById(x);let pid='',userId='';function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}async function init(){let{data}=await sb.auth.getSession();if(!data.session){location.href='/app-v2.html';return}userId=data.session.user.id;pid=new URLSearchParams(location.search).get('patient_id')||'';if(!pid){$('status').innerHTML='<span class="error">Patient ID is missing.</span>';return}let{data:p,error}=await sb.from('patients').select('*').eq('id',pid).eq('doctor_id',userId).single();if(error){$('status').innerHTML='<span class="error">'+esc(error.message)+'</span>';return}$('status').style.display='none';$('formCard').style.display='block';$('uhid').textContent=p.patient_id||'—';$('name').value=p.name||'';$('age').value=p.age??'';$('gender').value=p.gender||'Male';$('mobile').value=p.mobile||'';$('historyLink').href='/patients.html?patient_id='+encodeURIComponent(pid)}async function save(){let name=$('name').value.trim(),age=$('age').value.trim(),gender=$('gender').value,mobile=$('mobile').value.trim();if(!name){$('status').style.display='block';$('status').innerHTML='<span class="error">Patient name is required.</span>';return}let q=sb.from('patients').select('id,name,patient_id').eq('doctor_id',userId).eq('mobile',mobile).neq('id',pid).limit(1);if(mobile){let{data:dups,error}=await q;if(error){$('status').style.display='block';$('status').innerHTML='<span class="error">'+esc(error.message)+'</span>';return}if(dups&&dups.length){$('status').style.display='block';$('status').innerHTML='<span class="error">Duplicate patient detected: <b>'+esc(dups[0].name)+'</b> (UHID '+esc(dups[0].patient_id||'—')+'). The mobile number was not saved.</span>';return}}let{error}=await sb.from('patients').update({name,age:age?Number(age):null,gender,mobile:mobile||null}).eq('id',pid).eq('doctor_id',userId);if(error){$('status').style.display='block';$('status').innerHTML='<span class="error">'+esc(error.message)+'</span>';return}location.href='/patients.html?patient_id='+encodeURIComponent(pid)}init();</script></body></html>
