<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Prime Hospital - Prescription Templates</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>*{box-sizing:border-box}body{font:14px Arial;margin:0;background:#f4f7fb;color:#172033}.wrap{max-width:1050px;margin:20px auto;padding:20px;background:#fff;border-radius:12px}.top{display:flex;justify-content:space-between;align-items:center;gap:10px}.btn{padding:9px 13px;border-radius:6px;border:1px solid #123d88;background:#fff;color:#123d88;font-weight:bold;cursor:pointer;text-decoration:none}.primary{background:#123d88;color:#fff}.card{border:1px solid #dfe5ee;border-radius:9px;padding:15px;margin:12px 0}.fields{display:grid;grid-template-columns:1fr 1fr;gap:10px}.field label{display:block;font-weight:bold;font-size:12px;margin-bottom:4px}.field input,.field select{width:100%;padding:9px;border:1px solid #cfd7e3;border-radius:6px}.wide{grid-column:1/-1}.muted{color:#667085;font-size:12px}.med{display:grid;grid-template-columns:1.3fr 1fr 1fr auto;gap:8px;margin:7px 0}.med input{padding:8px;border:1px solid #cfd7e3;border-radius:5px}.template{border:1px solid #dfe5ee;border-radius:9px;padding:14px;margin:10px 0}.template h3{margin:0;color:#123d88}.pill{display:inline-block;background:#f4f7fb;padding:5px 8px;border-radius:5px;margin:3px;font-size:12px}@media(max-width:700px){.top{flex-direction:column;align-items:flex-start}.fields,.med{grid-template-columns:1fr}.wide{grid-column:auto}}</style></head><body><main class="wrap"><div class="top"><div><h1 style="color:#123d88;margin:0">PRIME HOSPITAL</h1><div>Prescription Templates / Favorites</div></div><div><a class="btn" href="/dashboard.html">Dashboard</a><a class="btn primary" href="/new-visit.html">New Consultation</a></div></div><div class="card"><h2 style="color:#123d88;margin-top:0">Create Your Own Template</h2><div class="muted">Templates contain only the medicines you choose. No clinical treatment regimen is pre-filled.</div><div class="fields" style="margin-top:12px"><div class="field wide"><label>Template Name *</label><input id="name" placeholder="e.g. My common OPD set"></div></div><div id="meds" style="margin-top:12px"></div><button class="btn" onclick="addMed()">＋ Add Medicine</button> <button class="btn primary" onclick="saveTemplate()">Save Template</button><div id="status" class="muted" style="margin-top:10px"></div></div><div id="list"></div></main><script>const SB_URL='https://prcvzefynoiuneybufge.supabase.co',SB_KEY='sb_publishable_JbxZuf181uR8zbmTyyfFiA_2pLjsq0C',sb=supabase.createClient(SB_URL,SB_KEY);const KEY='prime_hospital_prescription_templates';const $=x=>document.getElementById(x);let rows=0;function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}function load(){try{return JSON.parse(localStorage.getItem(KEY)||'[]')}catch{return[]}}function save(a){localStorage.setItem(KEY,JSON.stringify(a))}function addMed(v={}){rows++;let d=document.createElement('div');d.className='med';d.innerHTML=`<input class="brand" placeholder="Brand name" value="${esc(v.brand||'')}"><input class="form" placeholder="Formulation + dosage" value="${esc(v.form||'')}"><input class="tim" placeholder="When to take e.g. 1-0-1" value="${esc(v.tim||'')}"><button class="btn" onclick="this.parentElement.remove()">×</button>`;$('meds').appendChild(d)}function saveTemplate(){let name=$('name').value.trim();if(!name){$('status').textContent='Enter a template name.';return}let medicines=[...document.querySelectorAll('#meds .med')].map(r=>({brand:r.querySelector('.brand').value.trim(),form:r.querySelector('.form').value.trim(),tim:r.querySelector('.tim').value.trim()})).filter(x=>x.brand||x.form);if(!medicines.length){$('status').textContent='Add at least one medicine.';return}let a=load();a.push({id:crypto.randomUUID(),name,medicines});save(a);$('name').value='';$('meds').innerHTML='';rows=0;render();$('status').textContent='Template saved.'}function removeTemplate(id){save(load().filter(x=>x.id!==id));render()}function useTemplate(id){let t=load().find(x=>x.id===id);if(!t)return;sessionStorage.setItem('prime_selected_template',JSON.stringify(t.medicines));location.href='/new-visit.html'}function render(){let a=load();$('list').innerHTML='<h2 style="color:#123d88">Saved Templates</h2>'+(a.length?a.map(t=>`<div class="template"><h3>${esc(t.name)}</h3><div>${t.medicines.map(m=>`<span class="pill">${esc(m.brand)} ${esc(m.form)} — ${esc(m.tim)}</span>`).join('')}</div><div style="margin-top:10px"><button class="btn primary" onclick="useTemplate('${t.id}')">Use in New Consultation</button> <button class="btn" onclick="removeTemplate('${t.id}')">Delete</button></div></div>`).join(''):'<div class="muted">No templates saved yet.</div>')}async function init(){let{data}=await sb.auth.getSession();if(!data.session){location.href='/app-v2.html';return}render();addMed()}init();</script></body></html>
