<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Prime Hospital - Prescription Templates</title><style>*{box-sizing:border-box}body{font:14px Arial;margin:0;background:#f4f7fb;color:#172033}.wrap{max-width:1100px;margin:20px auto;padding:20px;background:#fff;border-radius:12px}.btn{padding:9px 13px;border-radius:6px;border:1px solid #123d88;background:#fff;color:#123d88;font-weight:bold;cursor:pointer;text-decoration:none}.primary{background:#123d88;color:#fff}.card{border:1px solid #dfe5ee;border-radius:9px;padding:14px;margin:12px 0}.fields{display:grid;grid-template-columns:1fr 1fr;gap:8px}.field label{display:block;font-size:11px;font-weight:bold;margin-bottom:4px}.field input,.field select{width:100%;padding:9px;border:1px solid #cfd7e3;border-radius:5px}.wide{grid-column:1/-1}.medtable{width:100%;border-collapse:collapse}.medtable th,.medtable td{border:1px solid #d9e0e8;padding:6px}.medtable input,.medtable select{width:100%;padding:7px;border:0}.med-search{position:relative}.suggest{position:absolute;z-index:10;left:0;right:0;background:#fff;border:1px solid #cfd7e3;max-height:180px;overflow:auto}.srow{padding:8px;border-bottom:1px solid #eee;cursor:pointer}.srow:hover{background:#eef4ff}.muted{color:#667085;font-size:12px}@media(max-width:700px){.fields{grid-template-columns:1fr}.wide{grid-column:auto}}</style></head><body><main class="wrap"><div><h1 style="color:#123d88;margin:0">PRIME HOSPITAL</h1><div>Prescription Templates</div></div><div class="card"><h2 style="color:#123d88">Create Template</h2><input id="name" style="width:100%;padding:9px;border:1px solid #cfd7e3;border-radius:5px" placeholder="Template name"><table class="medtable" style="margin-top:10px"><thead><tr><th>#</th><th>Brand / Search</th><th>Formulation + Dosage</th><th>When to Take</th><th></th></tr></thead><tbody id="rows"></tbody></table><button class="btn primary" onclick="addRow()">＋ Add Medicine</button> <button class="btn" onclick="saveTemplate()">Save Template</button><p id="status" class="muted"></p></div><div class="card"><h2 style="color:#123d88">Saved Templates</h2><div id="list"></div></div></main><script>const M='prime_hospital_medicine_library',T='prime_hospital_prescription_templates',$=x=>document.getElementById(x);let meds=JSON.parse(localStorage.getItem(M)||'[]'),ts=JSON.parse(localStorage.getItem(T)||'[]'),n=0;function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}function addRow(){n++;let r=document.createElement('tr');r.innerHTML=`<td>${n}</td><td><div class="med-search"><input class="brand" placeholder="type any word"><div class="suggest" style="display:none"></div></div></td><td><input class="form" placeholder="Tab 500 mg"></td><td><select class="when"><option>1-0-0</option><option>0-1-0</option><option>0-0-1</option><option>1-0-1</option><option>1-1-1</option><option>SOS</option><option>HS</option></select></td><td><button class="btn" onclick="this.closest('tr').remove()">×</button></td>`;$('rows').appendChild(r);let i=r.querySelector('.brand');i.oninput=()=>suggest(i)}function suggest(i){let q=i.value.toLowerCase().trim().split(/\s+/).filter(Boolean),b=i.parentElement.querySelector('.suggest');let a=meds.filter(m=>q.every(w=>(m.brand+' '+m.form+' '+m.tim).toLowerCase().includes(w))).slice(0,12);if(!q.length||!a.length){b.style.display='none';return}b.innerHTML=a.map((m,k)=>`<div class="srow"><b>${esc(m.brand)}</b><div class="muted">${esc(m.form)} • ${esc(m.tim)}</div></div>`).join('');b.style.display='block';b.querySelectorAll('.srow').forEach((x,k)=>x.onclick=()=>{let r=i.closest('tr');r.querySelector('.brand').value=a[k].brand;r.querySelector('.form').value=a[k].form;r.querySelector('.when').value=a[k].tim||'';b.style.display='none'})}function saveTemplate(){let name=$('name').value.trim(),ms=[...$('rows').rows].map(r=>({brand:r.querySelector('.brand').value.trim(),form:r.querySelector('.form').value.trim(),when:r.querySelector('.when').value})).filter(x=>x.brand);if(!name||!ms.length){$('status').textContent='Enter a name and at least one medicine.';return}ts.push({id:Date.now(),name,medicines:ms});localStorage.setItem(T,JSON.stringify(ts));$('name').value='';$('rows').innerHTML='';n=0;addRow();render();$('status').textContent='Template saved.'}function useTemplate(id){let t=ts.find(x=>x.id===id);sessionStorage.setItem('prime_selected_template',JSON.stringify(t));location.href='/new-visit.html'}function del(id){ts=ts.filter(x=>x.id!==id);localStorage.setItem(T,JSON.stringify(ts));render()}function render(){$('list').innerHTML=ts.length?ts.map(t=>`<div class="card"><b>${esc(t.name)}</b><div class="muted">${t.medicines.map(m=>esc(m.brand)+' '+esc(m.form)+' '+esc(m.when)).join(' • ')}</div><button class="btn primary" onclick="useTemplate(${t.id})">Use Template</button> <button class="btn" onclick="del(${t.id})">Delete</button></div>`).join(''):'<div class="muted">No templates saved.</div>'}addRow();render();</script></body></html>
