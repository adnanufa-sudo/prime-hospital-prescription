<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Prime Hospital - Daily OPD</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>body{font:14px Arial;margin:0;background:#f4f7fb;color:#172033}.wrap{max-width:1100px;margin:20px auto;padding:20px;background:#fff;border-radius:12px}.top{display:flex;justify-content:space-between;align-items:center;gap:10px}.btn{padding:9px 13px;border-radius:6px;border:1px solid #123d88;background:#fff;color:#123d88;font-weight:bold;cursor:pointer}.primary{background:#123d88;color:#fff}.card{border:1px solid #dfe5ee;border-radius:9px;padding:14px;margin:10px 0}.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.patient{display:flex;justify-content:space-between;gap:15px;align-items:center}.muted{color:#667085;font-size:12px}.error{color:#b42318}@media(max-width:700px){.patient{flex-direction:column;align-items:flex-start}}</style></head><body><main class="wrap"><div class="top"><div><h1 style="color:#123d88;margin:0">PRIME HOSPITAL</h1><div>Daily OPD Patient List</div></div><div class="row"><a class="btn" href="/patients.html">Patient History</a><a class="btn primary" href="/app-v2.html">New Consultation</a></div></div><div id="status" class="muted" style="margin-top:12px">Loading today's patients...</div><div id="list"></div></main><script>const SB_URL='https://prcvzefynoiuneybufge.supabase.co',SB_KEY='sb_publishable_JbxZuf181uR8zbmTyyfFiA_2pLjsq0C',sb=supabase.createClient(SB_URL,SB_KEY),$=x=>document.getElementById(x);function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]) )}async function init(){let {data,error}=await sb.auth.getSession();if(error||!data.session){location.href='/app-v2.html';return}let user=data.session.user;let today=new Date().toISOString().slice(0,10);let {data:visits,error:vErr}=await sb.from('visits').select('*').eq('doctor_id',user.id).eq('visit_date',today).order('visit_date',{ascending:false});if(vErr){$('status').innerHTML='<span class="error">'+esc(vErr.message)+'</span>';return}visits=visits||[];if(!visits.length){$('status').textContent='No patients recorded today.';return}let ids=[...new Set(visits.map(v=>v.patient_id))];let {data:patients,error:pErr}=await sb.from('patients').select('*').eq('doctor_id',user.id).in('id',ids);if(pErr){$('status').innerHTML='<span class="error">'+esc(pErr.message)+'</span>';return}let map=Object.fromEntries((patients||[]).map(p=>[p.id,p]));$('status').textContent='Today: '+visits.length+' visit(s)';$('list').innerHTML=visits.map(v=>{let p=map[v.patient_id]||{};return `<div class="card"><div class="patient"><div><h2 style="margin:0;color:#123d88">${esc(p.name||'Unknown patient')}</h2><div class="muted">UHID: ${esc(p.patient_id||'—')} • Age: ${esc(p.age||'—')} • ${esc(p.gender||'')} • Mobile: ${esc(p.mobile||'—')}</div><div style="margin-top:8px"><b>Visit:</b> ${esc(v.visit_date||'—')} &nbsp; <b>Diagnosis:</b> ${esc(v.diagnosis||'—')}</div><div style="margin-top:5px"><b>Complaints:</b> ${esc(v.complaints||'—')}</div></div><div class="row"><a class="btn" href="/patients.html">Open History</a><button class="btn primary" onclick="openPrescription('${v.patient_id}','${v.id}')">Today's Prescription</button><a class="btn" href="/new-visit.html?patient_id=${encodeURIComponent(v.patient_id)}">New Visit</a></div></div></div>`}).join('')}async function openPrescription(pid,vid){sessionStorage.setItem('opd_patient_id',pid);sessionStorage.setItem('opd_visit_id',vid);location.href='/patients.html'}init();</script></body></html>
