<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Prime Hospital - Patient Timeline</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>*{box-sizing:border-box}body{font:14px Arial;margin:0;background:#f4f7fb;color:#172033}.wrap{max-width:900px;margin:20px auto;padding:20px;background:#fff;border-radius:12px}.top{display:flex;justify-content:space-between;align-items:center;gap:10px}.btn{padding:9px 13px;border-radius:6px;border:1px solid #123d88;background:#fff;color:#123d88;font-weight:bold;text-decoration:none;cursor:pointer}.primary{background:#123d88;color:#fff}.search{display:flex;gap:8px;margin:18px 0}.search input{flex:1;padding:10px;border:1px solid #cfd7e3;border-radius:6px}.card{border:1px solid #dfe5ee;border-radius:10px;padding:15px;margin:12px 0}.patient{background:#eef4ff;border:1px solid #cbd9f5;border-radius:9px;padding:15px}.name{font-size:22px;font-weight:bold;color:#123d88}.timeline{border-left:3px solid #123d88;margin:20px 0 10px 12px;padding-left:20px}.event{position:relative;margin:0 0 22px}.event:before{content:'';position:absolute;left:-28px;top:5px;width:11px;height:11px;border-radius:50%;background:#123d88}.date{font-weight:bold;color:#123d88}.section{margin-top:8px}.muted{color:#667085;font-size:12px}.rx{margin:6px 0;padding-left:20px}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}@media(max-width:650px){.top{flex-direction:column;align-items:flex-start}.search{flex-direction:column}}@media print{.noPrint{display:none!important}.wrap{margin:0;max-width:none}.event{break-inside:avoid}}</style></head><body><main class="wrap"><div class="top"><div><h1 style="color:#123d88;margin:0">PRIME HOSPITAL</h1><div>Patient Clinical Timeline</div></div><div class="actions noPrint"><a class="btn" href="/dashboard.html">Dashboard</a><a class="btn" href="/patients.html">Patient History</a></div></div><div class="card noPrint"><div class="search"><input id="qid" placeholder="Enter UHID / Patient ID"><button class="btn primary" onclick="load()">Show Timeline</button></div><div class="muted">You can also open this page with <b>?patient_id=...</b></div></div><div id="out">Enter a patient UHID to view the timeline.</div></main><script>const SB_URL='https://prcvzefynoiuneybufge.supabase.co',SB_KEY='sb_publishable_JbxZuf181uR8zbmTyyfFiA_2pLjsq0C',sb=supabase.createClient(SB_URL,SB_KEY),$=x=>document.getElementById(x);function e(s){return String(s??'—').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]) )}async function init(){let{data}=await sb.auth.getSession();if(!data.session){location.href='/app-v2.html';return}let p=new URLSearchParams(location.search).get('patient_id');if(p)loadId(p)}async function load(){let q=$('qid').value.trim();if(!q){$('out').innerHTML='<div class="card muted">Enter a UHID.</div>';return}let{data:{user}}=await sb.auth.getUser();let{data:p,error}=await sb.from('patients').select('*').eq('doctor_id',user.id).ilike('patient_id','%'+q+'%').limit(1).single();if(error){$('out').innerHTML='<div class="card">'+e(error.message)+'</div>';return}loadId(p.id)}async function loadId(id){let{data:{user}}=await sb.auth.getUser();let{data:p,error:pe}=await sb.from('patients').select('*').eq('id',id).eq('doctor_id',user.id).single();if(pe){$('out').innerHTML='<div class="card">'+e(pe.message)+'</div>';return}let{data:v,error:ve}=await sb.from('visits').select('*').eq('patient_id',id).eq('doctor_id',user.id).order('visit_date',{ascending:false});if(ve){$('out').innerHTML='<div class="card">'+e(ve.message)+'</div>';return}let vs=v||[],ids=vs.map(x=>x.id),meds=[];if(ids.length){let r=await sb.from('prescriptions').select('*').in('visit_id',ids).order('sort_order');meds=r.data||[]}$('out').innerHTML=`<div class="patient"><div class="name">${e(p.name)}</div><div><b>UHID:</b> ${e(p.patient_id)} &nbsp; <b>Age:</b> ${e(p.age)} &nbsp; <b>Gender:</b> ${e(p.gender)} &nbsp; <b>Mobile:</b> ${e(p.mobile)}</div></div><div class="actions noPrint"><a class="btn primary" href="/new-visit.html?patient_id=${encodeURIComponent(p.id)}">Start New Visit</a><button class="btn" onclick="window.print()">Print Timeline</button></div><div class="timeline">${vs.length?vs.map(x=>{let ms=meds.filter(m=>m.visit_id===x.id);return `<div class="event"><div class="date">${e(x.visit_date)}</div><div class="card"><div class="section"><b>Complaints:</b> ${e(x.complaints)}</div><div class="section"><b>Diagnosis:</b> ${e(x.diagnosis)}</div><div class="section"><b>Vitals:</b> BP ${e(x.bp)} | Pulse ${e(x.pulse)} | SpO₂ ${e(x.spo2)} | Weight ${e(x.weight)} | Sugar ${e(x.blood_sugar)}</div><div class="section"><b>Advice:</b> ${e(x.advice)}</div>${ms.length?'<div class="section"><b>Medicines:</b><ol class="rx">'+ms.map(m=>`<li>${e(m.medicine_name)} ${e(m.strength)} — ${e(m.frequency)}</li>`).join('')+'</ol></div>':''}<div class="actions noPrint"><a class="btn" href="/prescription.html?visit_id=${encodeURIComponent(x.id)}">View / Print Prescription</a></div></div></div>`}).join(''):'<div class="card muted">No visits recorded.</div>'}</div>`}init();</script></body></html>
