<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Prescription</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>@page{size:A4;margin:0}body{font:13px Arial;color:#172033;margin:0}.sheet{width:210mm;min-height:297mm;padding:38mm 15mm 15mm;margin:auto}.patient{border-bottom:1px solid #999;padding:7px 0 9px;display:grid;grid-template-columns:2fr 1fr 1fr 1.5fr;gap:8px}.date{text-align:right;margin:7px 0}.section{margin-top:12px}.title{font-weight:bold;font-size:13px;margin-bottom:5px}.vitals{display:grid;grid-template-columns:repeat(5,1fr);gap:7px}.vital{border:1px solid #ccc;padding:6px}.rx{margin-top:16px}.rx table{width:100%;border-collapse:collapse}.rx th,.rx td{border-bottom:1px solid #bbb;padding:7px 5px;text-align:left}.rx th{font-size:11px}.advice{white-space:pre-wrap}.footer{margin-top:35mm;text-align:right}.printbar{text-align:center;margin:10px}.printbar button{padding:9px 16px}@media print{.printbar{display:none}.sheet{margin:0}.no-print{display:none}}</style></head><body><div class="printbar"><button onclick="window.print()">Print Prescription</button> <button onclick="window.close()">Close</button></div><main class="sheet" id="sheet">Loading...</main><script>const sb=supabase.createClient('https://prcvzefynoiuneybufge.supabase.co','sb_publishable_JbxZuf181uR8zbmTyyfFiA_2pLjsq0C'),$=x=>document.getElementById(x);function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}async function init(){let{data}=await sb.auth.getSession();if(!data.session){location.href='/app-v2.html';return}let id=new URLSearchParams(location.search).get('visit_id');if(!id){$('sheet').textContent='Prescription not found.';return}let{data:v,error}=await sb.from('visits').select('*').eq('id',id).eq('doctor_id',data.session.user.id).single();if(error){$('sheet').textContent=error.message;return}let{data:p}=await sb.from('patients').select('*').eq('id',v.patient_id).eq('doctor_id',data.session.user.id).single();let{data:m}=await sb.from('prescriptions').select('*').eq('visit_id',id).order('sort_order');$('sheet').innerHTML=`<div class="date"><b>Date:</b> ${esc(v.visit_date||'—')}</div><div class="patient"><div><b>Patient</b><br>${esc(p?.name||'—')}</div><div><b>UHID</b><br>${esc(p?.patient_id||'—')}</div><div><b>Age / Sex</b><br>${esc(p?.age||'—')} / ${esc(p?.gender||'—')}</div><div><b>Mobile</b><br>${esc(p?.mobile||'—')}</div></div><div class="section"><div class="title">Vitals</div><div class="vitals"><div class="vital">BP<br><b>${esc(v.bp||'—')}</b></div><div class="vital">Pulse<br><b>${esc(v.pulse||'—')}</b></div><div class="vital">SpO₂<br><b>${esc(v.spo2||'—')}</b></div><div class="vital">Weight<br><b>${esc(v.weight||'—')}</b></div><div class="vital">Sugar<br><b>${esc(v.blood_sugar||'—')}</b></div></div></div><div class="section"><div class="title">Chief Complaints / Examination</div>${esc(v.complaints||'—')}</div><div class="section"><div class="title">Diagnosis</div>${esc(v.diagnosis||'—')}</div><div class="rx"><div class="title">Prescription</div><table><thead><tr><th width="5%">#</th><th width="40%">Medicine</th><th width="20%">When to Take</th><th>Duration / Instructions</th></tr></thead><tbody>${(m||[]).map((x,i)=>`<tr><td>${i+1}</td><td><b>${esc(x.medicine_name||'')}</b> ${esc(x.strength||'')}</td><td>${esc(x.frequency||'—')}</td><td>${esc(x.duration||'—')} ${x.instruction?' • '+esc(x.instruction):''}</td></tr>`).join('')||'<tr><td colspan="4">No medicines recorded.</td></tr>'}</tbody></table></div><div class="section"><div class="title">Advice / Treatment</div><div class="advice">${esc(v.advice||'—')}</div></div><div class="footer">Signature: __________________________</div>`}init();</script></body></html>
