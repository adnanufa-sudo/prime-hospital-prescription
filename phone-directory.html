<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Prime Hospital - Phone Directory</title><style>*{box-sizing:border-box}body{font:14px Arial;margin:0;background:#f4f7fb;color:#172033}.wrap{max-width:1000px;margin:20px auto;padding:20px;background:#fff;border-radius:12px}.top{display:flex;justify-content:space-between;align-items:center;gap:10px}.btn{padding:9px 13px;border-radius:6px;border:1px solid #123d88;background:#fff;color:#123d88;font-weight:bold;cursor:pointer;text-decoration:none}.primary{background:#123d88;color:#fff}.fields{display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:8px}.field label{display:block;font-size:11px;font-weight:bold;margin-bottom:4px}.field input,.field select{width:100%;padding:9px;border:1px solid #cfd7e3;border-radius:6px}.card{border:1px solid #dfe5ee;border-radius:9px;padding:14px;margin:12px 0}.entry{display:flex;justify-content:space-between;gap:15px;align-items:center;padding:12px 0;border-bottom:1px solid #e5e7eb}.entry:last-child{border-bottom:0}.muted{color:#667085;font-size:12px}.actions{display:flex;gap:6px;flex-wrap:wrap}.search{margin:12px 0}.search input{width:100%;padding:10px;border:1px solid #cfd7e3;border-radius:6px}@media(max-width:700px){.fields{grid-template-columns:1fr 1fr}.top{flex-direction:column;align-items:flex-start}.entry{align-items:flex-start;flex-direction:column}}@media print{.no-print{display:none!important}.wrap{margin:0;max-width:none}}
</style></head><body><main class="wrap"><div class="top"><div><h1 style="color:#123d88;margin:0">PRIME HOSPITAL</h1><div>Phone Directory / Advertisement List</div></div><div><a class="btn" href="/dashboard.html">Dashboard</a><a class="btn" href="/app-v2.html">New Consultation</a></div></div><div class="card no-print"><h2 style="color:#123d88">Add Phone Number</h2><div class="fields"><div class="field"><label>Name / Business *</label><input id="name"></div><div class="field"><label>Phone Number *</label><input id="phone" inputmode="tel"></div><div class="field"><label>Category</label><select id="category"><option>Directory</option><option>Advertisement</option><option>Supplier</option><option>Doctor</option><option>Laboratory</option><option>Pharmacy</option><option>Ambulance</option><option>Other</option></select></div><div class="field"><label>Note</label><input id="note" placeholder="Optional"></div></div><button class="btn primary" style="margin-top:10px" onclick="addEntry()">Add Number</button><span id="status" class="muted" style="margin-left:8px"></span></div><div class="card no-print"><input class="search" id="search" placeholder="Search name, number or category" oninput="render()"><div class="actions"><button class="btn" onclick="window.print()">Print Directory</button><button class="btn" onclick="exportData()">Export CSV</button><button class="btn" onclick="clearAll()">Clear All</button></div></div><div class="card"><h2 style="color:#123d88">Saved Numbers</h2><div id="list"></div></div></main><script>const KEY='prime_hospital_phone_directory_v1';function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]) )}function get(){try{return JSON.parse(localStorage.getItem(KEY)||'[]')}catch{return[]}}function save(a){localStorage.setItem(KEY,JSON.stringify(a))}function addEntry(){let name=document.getElementById('name').value.trim(),phone=document.getElementById('phone').value.trim(),category=document.getElementById('category').value,note=document.getElementById('note').value.trim();if(!name||!phone){document.getElementById('status').textContent='Name and phone are required.';return}let a=get();a.push({id:Date.now(),name,phone,category,note});save(a);document.getElementById('name').value='';document.getElementById('phone').value='';document.getElementById('note').value='';document.getElementById('status').textContent='Saved.';render()}function removeEntry(id){save(get().filter(x=>x.id!==id));render()}function render(){let q=document.getElementById('search').value.toLowerCase(),a=get().filter(x=>!q||(x.name+' '+x.phone+' '+x.category+' '+x.note).toLowerCase().includes(q));document.getElementById('list').innerHTML=a.map(x=>`<div class="entry"><div><b>${esc(x.name)}</b><div class="muted">${esc(x.category)}${x.note?' • '+esc(x.note):''}</div><a href="tel:${esc(x.phone)}">${esc(x.phone)}</a></div><button class="btn no-print" onclick="removeEntry(${x.id})">Delete</button></div>`).join('')||'<div class="muted">No numbers saved.</div>'}function exportData(){let a=get(),csv='Name,Phone,Category,Note\n'+a.map(x=>[x.name,x.phone,x.category,x.note].map(v=>'"'+String(v??'').replace(/"/g,'""')+'"').join(',')).join('\n'),blob=new Blob([csv],{type:'text/csv'}),u=URL.createObjectURL(blob),ael=document.createElement('a');ael.href=u;ael.download='prime-hospital-phone-directory.csv';ael.click();URL.revokeObjectURL(u)}function clearAll(){if(confirm('Delete all saved directory numbers from this browser?')){localStorage.removeItem(KEY);render()}}render();</script></body></html>
