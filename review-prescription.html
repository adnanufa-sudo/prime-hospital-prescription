<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Prime Hospital - Old Prescription</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>body{font:14px Arial;background:#eee;margin:0;color:#172033}.sheet{width:148mm;min-height:210mm;margin:20px auto;background:#fff;padding:10mm;box-sizing:border-box}.top{border-bottom:1px solid #222;padding-bottom:8px}.row{padding:5px 0}.rx{width:100%;border-collapse:collapse;margin-top:10px}.rx th,.rx td{border:1px solid #999;padding:6px;text-align:left}.muted{color:#667085;font-size:12px}.actions{text-align:center;margin:15px}.btn{padding:9px 14px;border:1px solid #123d88;border-radius:6px;background:#fff;color:#123d88;font-weight:bold;text-decoration:none;cursor:pointer}@media print{body{background:#fff}.sheet{margin:0}.actions{display:none}} </style></head><body><div class="actions"><button class="btn" onclick="window.print()">🖨️ Print Prescription</button> <a class="btn" href="/patients.html">← Patient History</a></div><main class="sheet"><div class="top"><h2>PRIME HOSPITAL</h2><div>Dr. Adnan H. Khan • M.B.B.S. • CDMD (CCCDM Diabetes) • ACCD (Dermatology) • Reg. No. 20250301089</div></div><div id="content" class="muted">Loading prescription...</div></main><script>const sb=supabase.createClient('https://prcvzefynoiuneybufge.supabase.co','sb_publishable_JbxZuf181uR8zbmTyyfFiA_2pLjsq0C');const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));async function init(){let {data:{user}}=await sb.auth.getUser();let id=new URLSearchParams(location.search).get('visit_id');if(!user||!id){document.getElementById('content').textContent='Unable to open prescription.';return}let v=await sb.from('visits').select('*,patients(name,age,gender,mobile,patient_id)').eq('id',id).eq('doctor_id',user.id).single();if(v.error){document.getElementById('content').textContent=v.error.message;return}let p=v.data.patients||{};let r=await sb.from('prescriptions').select('*').eq('visit_id',id).order('sort_order');let meds=r.data||[];document.getElementById('content').innerHTML='<div class="row"><b>Patient:</b> '+esc(p.name)+' &nbsp; <b>Age:</b> '+esc(p.age)+' &nbsp; <b>Sex:</b> '+esc(p.gender)+'</div><div class="row"><b>UHID:</b> '+esc(p.patient_id)+' &nbsp; <b>Mobile:</b> '+esc(p.mobile)+' &nbsp; <b>Visit date:</b> '+esc(v.data.visit_date)+'</div><div class="row"><b>Complaints:</b> '+esc(v.data.complaints||'—')+'</div><div class="row"><b>Diagnosis:</b> '+esc(v.data.diagnosis||'—')+'</div><div class="row"><b>Vitals:</b> BP '+esc(v.data.bp||'—')+' · Pulse '+esc(v.data.pulse||'—')+' · SpO₂ '+esc(v.data.spo2||'—')+' · Temp '+esc(v.data.temperature||'—')+' · Weight '+esc(v.data.weight||'—')+' · Sugar '+esc(v.data.blood_sugar||'—')+'</div><h3>Prescription</h3><table class="rx"><tr><th>#</th><th>Medicine</th><th>Strength</th><th>Frequency</th><th>Duration</th><th>Instruction</th></tr>'+meds.map((m,i)=>'<tr><td>'+(i+1)+'</td><td>'+esc(m.medicine_name)+'</td><td>'+esc(m.strength)+'</td><td>'+esc(m.frequency)+'</td><td>'+esc(m.duration)+'</td><td>'+esc(m.instruction)+'</td></tr>').join('')+'</table><div class="row"><b>Advice / Follow-up:</b> '+esc(v.data.advice||'—')+'</div><div style="margin-top:35px;text-align:right"><b>Dr. Adnan H. Khan</b><br>M.B.B.S. • CDMD • ACCD</div>'}init();</script></body></html>
