<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Prime Hospital - Patients</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>body{font:14px Arial;margin:0;background:#f4f7fb;color:#172033}.wrap{max-width:900px;margin:20px auto;padding:20px;background:#fff;border-radius:12px}.top{display:flex;justify-content:space-between;align-items:center}.brand{text-decoration:none;color:#123d88}.brand h1{margin:0}.btn{padding:9px 13px;border:1px solid #123d88;border-radius:6px;background:#fff;color:#123d88;font-weight:bold;text-decoration:none;cursor:pointer;display:inline-block}.primary{background:#123d88;color:#fff}.danger{border-color:#b42318;color:#b42318;background:#fff}.search{display:flex;gap:8px;margin:18px 0}.search input{flex:1;padding:11px;border:1px solid #ccd4df;border-radius:6px}.patient{border:1px solid #dfe5ee;border-radius:10px;margin:10px 0;overflow:hidden}.patientHead{padding:14px;background:#f7f9fc;display:flex;justify-content:space-between;align-items:center;cursor:pointer}.name{font-size:18px;font-weight:bold;color:#123d88}.history{display:none;padding:12px}.patient.open .history{display:block}.visit{border-top:1px solid #e5e7eb}.visit summary{padding:12px;cursor:pointer;font-weight:bold;color:#123d88}.details{padding:0 12px 12px}.row{padding:5px 0}.rx{margin-top:12px;border:1px solid #dfe5ee;border-radius:7px;padding:10px;background:#fafbfc}.rx h4{margin:0 0 8px;color:#123d88}.rxrow{padding:6px 0;border-bottom:1px solid #e5e7eb}.rxrow:last-child{border-bottom:0}.actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:10px}.error{padding:12px;background:#fff1f0;color:#b42318;border:1px solid #f0b8b2;border-radius:6px}.muted{color:#667085;font-size:12px}.patientTools{display:flex;gap:7px;align-items:center}@media(max-width:650px){.top{align-items:flex-start;gap:10px;flex-direction:column}.search{flex-direction:column}}
</style></head><body><main class="wrap"><div class="top"><a class="brand" href="/"><h1>PRIME HOSPITAL</h1><div>Patients & History</div></a><a class="btn primary" href="/app-v2.html">＋ New Consultation</a></div><div class="search"><input id="q" placeholder="Search patient name, mobile or UHID"><button class="btn" onclick="loadPatients()">Search</button></div><div id="status" class="muted">Loading patients...</div><div id="list"></div></main><script>const sb=supabase.createClient('https://prcvzefynoiuneybufge.supabase.co','sb_publishable_JbxZuf181uR8zbmTyyfFiA_2pLjsq0C');const $=id=>document.getElementById(id);const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));async function loadPatients(){ $('status').textContent='Loading patients...';$('list').innerHTML='';try{const {data:{user},error:ue}=await sb.auth.getUser();if(ue)throw ue;if(!user){$('status').innerHTML='<div class="error">Please log in first. <a href="/app-v2.html">Open Login</a></div>';return}let q=sb.from('patients').select('id,name,age,gender,mobile,patient_id').eq('doctor_id',user.id).order('name').limit(100);const term=$('q').value.trim();if(term)q=q.or('name.ilike.%'+term+'%,mobile.ilike.%'+term+'%,patient_id.ilike.%'+term+'%');const {data:ps,error}=await q;if(error)throw error;if(!ps?.length){$('status').textContent=term?'No patient found.':'No patients yet.';return}$('status').textContent=ps.length+' patient'+(ps.length===1?'':'s');ps.forEach(p=>{const box=document.createElement('div');box.className='patient';box.innerHTML='<div class="patientHead"><div><div class="name">'+esc(p.name)+'</div><div class="muted">Age '+esc(p.age||'—')+' · '+esc(p.gender||'—')+' · UHID '+esc(p.patient_id||'—')+'</div></div><div class="patientTools"><button class="btn danger deletePatient">Delete Patient</button><span>▼</span></div></div><div class="history"><div class="muted">Loading visits...</div></div>';$('list').appendChild(box);box.querySelector('.patientHead').onclick=e=>{if(e.target.closest('.deletePatient'))return;togglePatient(box,p.id,user.id)};box.querySelector('.deletePatient').onclick=e=>{e.stopPropagation();deletePatient(p.id,p.name,user.id)}})}catch(e){$('status').innerHTML='<div class="error">Unable to load patients: '+esc(e.message||e)+'</div>'}}async function togglePatient(box,pid,uid){if(box.classList.contains('open')){box.classList.remove('open');return}box.classList.add('open');const h=box.querySelector('.history');try{const {data:vs,error}=await sb.from('visits').select('id,visit_date,complaints,diagnosis,advice,bp,pulse,spo2,weight,blood_sugar').eq('patient_id',pid).eq('doctor_id',uid).order('visit_date',{ascending:false});if(error)throw error;if(!vs?.length){h.innerHTML='<div class="muted">No visits recorded.</div>';return}const ids=vs.map(v=>v.id);const {data:pres,error:pe}=await sb.from('prescriptions').select('*').in('visit_id',ids);if(pe)throw pe;const byVisit={};(pres||[]).forEach(x=>(byVisit[x.visit_id]??=[]).push(x));h.innerHTML=vs.map((v,i)=>{const ms=byVisit[v.id]||[];const rx=ms.length?'<div class="rx"><h4>💊 Complete Prescription</h4>'+ms.map(x=>'<div class="rxrow"><b>'+esc(x.medicine_name||x.brand_name||x.name||'')+'</b>'+((x.strength||x.formulation)?' — '+esc(x.formulation||'')+' '+esc(x.strength||''):'')+'<br><span class="muted">Timing: '+esc(x.frequency||x.timing||'—')+' · Duration: '+esc(x.duration||'—')+(x.instruction?' · '+esc(x.instruction):'')+'</span></div>').join('')+'</div>':'<div class="rx"><h4>💊 Complete Prescription</h4><span class="muted">No medicines recorded for this visit.</span></div>';return '<details class="visit" '+(i===0?'open':'')+'><summary>'+esc(v.visit_date||'Date not recorded')+(i===0?' · LATEST':'')+'</summary><div class="details"><div class="row"><b>Complaints:</b> '+esc(v.complaints||'—')+'</div><div class="row"><b>Diagnosis:</b> '+esc(v.diagnosis||'—')+'</div><div class="row"><b>Advice:</b> '+esc(v.advice||'—')+'</div><div class="row"><b>Vitals:</b> BP '+esc(v.bp||'—')+' · Pulse '+esc(v.pulse||'—')+' · SpO₂ '+esc(v.spo2||'—')+' · Weight '+esc(v.weight||'—')+' · Sugar '+esc(v.blood_sugar||'—')+'</div>'+rx+'<div class="actions"><a class="btn" href="/review-prescription.html?visit_id='+encodeURIComponent(v.id)+'">👁 Review Old Prescription</a> <a class="btn" href="/app-v2.html?patient_id='+encodeURIComponent(pid)+'&copy_visit_id='+encodeURIComponent(v.id)+'">🔁 Repeat Prescription</a> <a class="btn primary" href="/app-v2.html?patient_id='+encodeURIComponent(pid)+'&followup=1">＋ New Consultation</a> <button class="btn danger" onclick="deleteVisit(\''+esc(v.id)+'\',\''+esc(pid)+'\',\''+esc(v.visit_date||'this visit')+'\')">🗑 Delete Visit</button></div></div></details>'}).join('')}catch(e){h.innerHTML='<div class="error">Unable to load visit/prescription history: '+esc(e.message||e)+'</div>'}}async function deleteVisit(vid,pid,date){if(!confirm('Delete the visit dated '+date+' and its saved prescription?\n\nThis cannot be undone.'))return;try{const {error:pe}=await sb.from('prescriptions').delete().eq('visit_id',vid);if(pe)throw pe;const {error:ve}=await sb.from('visits').delete().eq('id',vid);if(ve)throw ve;alert('Visit deleted.');loadPatients()}catch(e){alert('Could not delete visit: '+(e.message||e))}}async function deletePatient(pid,name,uid){if(!confirm('Delete patient '+name+' and ALL of this patient’s visits and prescriptions?\n\nTHIS CANNOT BE UNDONE.'))return;if(!confirm('Final confirmation: permanently delete '+name+' and complete medical history?'))return;try{const {data:vs,error:fe}=await sb.from('visits').select('id').eq('patient_id',pid).eq('doctor_id',uid);if(fe)throw fe;const ids=(vs||[]).map(v=>v.id);if(ids.length){const {error:pe}=await sb.from('prescriptions').delete().in('visit_id',ids);if(pe)throw pe;const {error:ve}=await sb.from('visits').delete().in('id',ids);if(ve)throw ve}const {error:ce}=await sb.from('patients').delete().eq('id',pid).eq('doctor_id',uid);if(ce)throw ce;alert('Patient and complete history deleted.');loadPatients()}catch(e){alert('Could not delete patient: '+(e.message||e))}}$('q').addEventListener('keydown',e=>{if(e.key==='Enter')loadPatients()});loadPatients();</script></body></html>
