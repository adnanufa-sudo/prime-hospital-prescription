<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Prime Hospital - Patients & History</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
body{font:14px Arial;margin:0;background:#f4f7fb;color:#172033}.wrap{max-width:1100px;margin:20px auto;padding:20px;background:#fff;border-radius:12px}.top{display:flex;justify-content:space-between;align-items:center;gap:10px}.brand{color:#123d88;text-decoration:none}.brand h1{margin:0}.btn{padding:9px 13px;border-radius:6px;border:1px solid #123d88;background:#fff;color:#123d88;font-weight:bold;cursor:pointer;text-decoration:none;display:inline-block}.primary{background:#123d88;color:#fff}.search{display:grid;grid-template-columns:1fr 1fr 1fr auto;gap:8px;margin:18px 0}.search input{padding:10px;border:1px solid #cfd7e3;border-radius:6px}.card{border:1px solid #dfe5ee;border-radius:9px;padding:14px;margin:10px 0}.patientHeader{background:#eef4ff;border:1px solid #cbd9f5;border-radius:10px;padding:18px;margin-bottom:15px}.patientName{font-size:22px;font-weight:bold;color:#123d88}.muted{color:#667085;font-size:12px}.visit{border:1px solid #dfe5ee;border-radius:9px;padding:15px;margin:14px 0;background:#fff}.latest{border:2px solid #123d88;background:#f8fbff}.visitTitle{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px}.latestBadge{background:#123d88;color:#fff;padding:5px 8px;border-radius:5px;font-size:11px;font-weight:bold}.vitals{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin:12px 0}.vital{background:#f4f7fb;border-radius:6px;padding:9px}.section{margin-top:10px;padding-top:10px;border-top:1px solid #e5e7eb}.sectionTitle{font-weight:bold;color:#123d88;margin-bottom:5px}.rx{margin-top:8px}.rx li{margin:6px 0}.actions{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}.empty{color:#667085;padding:10px 0}.error{color:#b42318;background:#fff1f0;border:1px solid #f0b8b2;padding:10px;border-radius:6px}.hidden{display:none!important}@media(max-width:700px){.search{grid-template-columns:1fr}.top{align-items:flex-start;flex-direction:column}.vitals{grid-template-columns:1fr 1fr}.visitTitle{flex-direction:column;align-items:flex-start}}@media print{body{background:#fff}.wrap{max-width:none;margin:0;padding:10px}.noPrint{display:none!important}.card{border:none}.visit{break-inside:avoid}}
</style>
</head>
<body>
<main class="wrap">
<div class="top noPrint">
<a class="brand" href="/" title="Back to Home"><h1>PRIME HOSPITAL</h1><div>Patients & Complete History</div></a>
<div class="actions"><a class="btn" href="/app-v2.html">New Consultation</a><a class="btn" href="/">Home</a><button class="btn" onclick="logout()">Logout</button></div>
</div>
<div id="status" class="muted" style="margin-top:10px">Checking login...</div>
<div id="searchArea" class="card noPrint hidden">
<h2 style="color:#123d88">Find Patient</h2>
<div class="search">
<input id="qname" placeholder="Patient name">
<input id="qmobile" placeholder="Mobile number">
<input id="quid" placeholder="UHID / Patient ID">
<button class="btn primary" onclick="searchPatients()">Search</button>
</div>
<div id="results"></div>
</div>
<div id="history" class="card hidden"></div>
</main>
<script>
const SB_URL='https://prcvzefynoiuneybufge.supabase.co';
const SB_KEY='sb_publishable_JbxZuf181uR8zbmTyyfFiA_2pLjsq0C';
const sb=supabase.createClient(SB_URL,SB_KEY);
let patientForPrint=null,visitsForPrint=[],medicinesForPrint=[];
const $=id=>document.getElementById(id);
function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));}
function showError(el,msg){$(el).innerHTML='<div class="error">'+esc(msg)+'</div>';}
async function init(){
 try{
  const {data,error}=await sb.auth.getSession();
  if(error) throw error;
  if(!data.session){location.href='/app-v2.html';return;}
  $('status').textContent='';$('searchArea').classList.remove('hidden');
 }catch(e){showError('status',e.message||'Unable to check login.');}
}
async function logout(){await sb.auth.signOut();location.href='/app-v2.html';}
async function searchPatients(){
 const results=$('results');results.innerHTML='<p class="muted">Searching...</p>';
 try{
  const {data:{user},error:ue}=await sb.auth.getUser();if(ue)throw ue;if(!user){location.href='/app-v2.html';return;}
  const qn=$('qname').value.trim(),qm=$('qmobile').value.trim(),qi=$('quid').value.trim();
  if(!qn&&!qm&&!qi){results.innerHTML='<p class="muted">Enter patient name, mobile number or UHID.</p>';return;}
  let q=sb.from('patients').select('*').eq('doctor_id',user.id).order('name').limit(50);
  if(qn)q=q.ilike('name','%'+qn+'%');
  if(qm)q=q.ilike('mobile','%'+qm+'%');
  if(qi)q=q.ilike('patient_id','%'+qi+'%');
  const {data,error}=await q;if(error)throw error;
  if(!data||!data.length){results.innerHTML='<p class="muted">No patient found.</p>';return;}
  results.innerHTML=data.map(p=>`<div class="card"><b>${esc(p.name)}</b><div class="muted">UHID: ${esc(p.patient_id||'—')} • Age: ${esc(p.age||'—')} • ${esc(p.gender||'')} • Mobile: ${esc(p.mobile||'—')}</div><button class="btn primary" style="margin-top:8px" onclick="showHistory('${esc(p.id)}')">View Complete History</button></div>`).join('');
 }catch(e){showError('results',e.message||'Patient search failed.');}
}
async function showHistory(pid){
 const h=$('history');h.classList.remove('hidden');h.innerHTML='<p class="muted">Loading patient history...</p>';
 try{
  const {data:{user},error:ue}=await sb.auth.getUser();if(ue)throw ue;if(!user){location.href='/app-v2.html';return;}
  const {data:p,error:pe}=await sb.from('patients').select('*').eq('id',pid).eq('doctor_id',user.id).single();if(pe)throw pe;
  const {data:visits,error:ve}=await sb.from('visits').select('*').eq('patient_id',pid).eq('doctor_id',user.id).order('visit_date',{ascending:false});if(ve)throw ve;
  const visitList=visits||[],ids=visitList.map(v=>v.id);let meds=[];
  if(ids.length){
   // Do not order by sort_order: older database versions may not have that column.
   const {data,error}=await sb.from('prescriptions').select('*').in('visit_id',ids);if(error)throw error;
   meds=data||[];
  }
  patientForPrint=p;visitsForPrint=visitList;medicinesForPrint=meds;
  let html=`<div class="patientHeader"><div class="patientName">${esc(p.name)}</div><div style="margin-top:6px"><b>UHID:</b> ${esc(p.patient_id||'—')} &nbsp;|&nbsp; <b>Age:</b> ${esc(p.age||'—')} &nbsp;|&nbsp; <b>Gender:</b> ${esc(p.gender||'—')} &nbsp;|&nbsp; <b>Mobile:</b> ${esc(p.mobile||'—')}</div></div><div class="actions noPrint"><button class="btn" onclick="backToSearch()">← Back to Search</button><a class="btn primary" href="/app-v2.html?patient_id=${encodeURIComponent(p.id)}">Start Follow-up</a><button class="btn primary" onclick="window.print()">Print Patient History</button></div>`;
  if(!visitList.length){html+='<div class="empty">No previous visits found for this patient.</div>';h.innerHTML=html;return;}
  html+='<h2 style="color:#123d88">Complete Visit History</h2>';
  visitList.forEach((v,index)=>{
   const vm=meds.filter(m=>m.visit_id===v.id);
   html+=`<div class="visit ${index===0?'latest':''}`}><div class="visitTitle"><b>Visit Date: ${esc(v.visit_date||'—')}</b>${index===0?'<span class="latestBadge">LATEST VISIT</span>':''}</div><div class="vitals"><div class="vital"><div class="muted">BP</div><b>${esc(v.bp||'—')}</b></div><div class="vital"><div class="muted">Pulse</div><b>${esc(v.pulse||'—')}</b></div><div class="vital"><div class="muted">SpO₂</div><b>${esc(v.spo2||'—')}</b></div><div class="vital"><div class="muted">Weight</div><b>${esc(v.weight||'—')}</b></div><div class="vital"><div class="muted">Sugar</div><b>${esc(v.blood_sugar||'—')}</b></div></div><div class="section"><div class="sectionTitle">Complaints</div>${esc(v.complaints||'—')}</div><div class="section"><div class="sectionTitle">Diagnosis</div>${esc(v.diagnosis||'—')}</div><div class="section"><div class="sectionTitle">Advice / Treatment</div>${esc(v.advice||'—')}</div><div class="section"><div class="sectionTitle">Medicines Prescribed</div>${vm.length?'<ol class="rx">'+vm.map(m=>`<li><b>${esc(m.medicine_name||'')}</b> ${esc(m.strength||'')} ${m.frequency?' — '+esc(m.frequency):''}${m.duration?' — '+esc(m.duration):''}${m.instruction?' — '+esc(m.instruction):''}</li>`).join('')+'</ol>':'<div class="muted">No medicines recorded.</div>'}</div><div class="actions noPrint"><button class="btn primary" onclick="printVisit('${esc(v.id)}')">View / Print Prescription</button><a class="btn" href="/app-v2.html?patient_id=${encodeURIComponent(p.id)}&copy_visit_id=${encodeURIComponent(v.id)}">Repeat This Prescription</a></div></div>`;
  });
  h.innerHTML=html;h.scrollIntoView({behavior:'smooth',block:'start'});
 }catch(e){showError('history',e.message||'Unable to load patient history.');}
}
function backToSearch(){$('history').classList.add('hidden');$('results').scrollIntoView({behavior:'smooth'});}
function printVisit(visitId){
 const visit=visitsForPrint.find(v=>v.id===visitId),patient=patientForPrint;if(!visit||!patient){alert('Visit details not found.');return;}
 const meds=medicinesForPrint.filter(m=>m.visit_id===visitId);
 const rows=meds.length?meds.map((m,i)=>`<tr><td>${i+1}</td><td><b>${esc(m.medicine_name||'')}</b> ${esc(m.strength||'')}</td><td>${esc(m.frequency||'—')}</td><td>${esc(m.duration||'—')}</td><td>${esc(m.instruction||'—')}</td></tr>`).join(''):'<tr><td colspan="5">No medicines recorded.</td></tr>';
 const w=window.open('','_blank','width=900,height=700');if(!w){alert('Please allow pop-ups for Prime Hospital.');return;}
 w.document.write(`<!doctype html><html><head><meta charset="utf-8"><title>Prime Hospital Prescription</title><style>body{font-family:Arial;margin:30px;color:#172033}.header{text-align:center;border-bottom:2px solid #123d88;padding-bottom:12px}.header h1{margin:0;color:#123d88}.patient{margin-top:20px;border:1px solid #ccc;padding:12px}.section{margin-top:18px}.section h3{color:#123d88;border-bottom:1px solid #ddd;padding-bottom:5px}.vitals{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}.vital{border:1px solid #ddd;padding:8px}table{width:100%;border-collapse:collapse;margin-top:10px}th,td{border:1px solid #bbb;padding:8px;text-align:left}th{background:#f1f4f8}.footer{margin-top:60px;text-align:right}.printButton{padding:10px 18px;margin-bottom:20px}@media print{.printButton{display:none}}</style></head><body><button class="printButton" onclick="window.print()">Print Prescription</button><div class="header"><h1>PRIME HOSPITAL</h1><div>Quality Treatment</div><div>Patient Prescription</div></div><div class="patient"><b>Patient:</b> ${esc(patient.name||'—')} &nbsp;&nbsp; <b>UHID:</b> ${esc(patient.patient_id||'—')}<br><br><b>Age:</b> ${esc(patient.age||'—')} &nbsp;&nbsp; <b>Gender:</b> ${esc(patient.gender||'—')} &nbsp;&nbsp; <b>Mobile:</b> ${esc(patient.mobile||'—')}<br><br><b>Visit Date:</b> ${esc(visit.visit_date||'—')}</div><div class="section"><h3>Vitals</h3><div class="vitals"><div class="vital"><b>BP</b><br>${esc(visit.bp||'—')}</div><div class="vital"><b>Pulse</b><br>${esc(visit.pulse||'—')}</div><div class="vital"><b>SpO₂</b><br>${esc(visit.spo2||'—')}</div><div class="vital"><b>Weight</b><br>${esc(visit.weight||'—')}</div><div class="vital"><b>Sugar</b><br>${esc(visit.blood_sugar||'—')}</div></div></div><div class="section"><h3>Complaints</h3>${esc(visit.complaints||'—')}</div><div class="section"><h3>Diagnosis</h3>${esc(visit.diagnosis||'—')}</div><div class="section"><h3>Medicines</h3><table><thead><tr><th>No.</th><th>Medicine</th><th>Frequency</th><th>Duration</th><th>Instructions</th></tr></thead><tbody>${rows}</tbody></table></div><div class="section"><h3>Advice / Treatment</h3>${esc(visit.advice||'—')}</div><div class="footer"><b>Doctor</b><br><br>________________________</div></body></html>`);w.document.close();}
init();
</script>
</body>
</html>
