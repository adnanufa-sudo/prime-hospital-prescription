<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Prime Hospital - Patient History</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
body{
  font:14px Arial;
  margin:0;
  background:#f4f7fb;
  color:#172033;
}

.wrap{
  max-width:1100px;
  margin:20px auto;
  padding:20px;
  background:#fff;
  border-radius:12px;
}

.top{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:10px;
}

.btn{
  padding:9px 13px;
  border-radius:6px;
  border:1px solid #123d88;
  background:#fff;
  color:#123d88;
  font-weight:bold;
  cursor:pointer;
}

.primary{
  background:#123d88;
  color:#fff;
}

.search{
  display:grid;
  grid-template-columns:1fr 1fr 1fr auto;
  gap:8px;
  margin:18px 0;
}

.search input{
  padding:10px;
  border:1px solid #cfd7e3;
  border-radius:6px;
}

.card{
  border:1px solid #dfe5ee;
  border-radius:9px;
  padding:14px;
  margin:10px 0;
}

.patientHeader{
  background:#eef4ff;
  border:1px solid #cbd9f5;
  border-radius:10px;
  padding:18px;
  margin-bottom:15px;
}

.patientName{
  font-size:22px;
  font-weight:bold;
  color:#123d88;
}

.muted{
  color:#667085;
  font-size:12px;
}

.visit{
  border:1px solid #dfe5ee;
  border-radius:9px;
  padding:15px;
  margin:14px 0;
  background:#fff;
}

.latest{
  border:2px solid #123d88;
  background:#f8fbff;
}

.visitTitle{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:10px;
  margin-bottom:12px;
}

.latestBadge{
  background:#123d88;
  color:#fff;
  padding:5px 8px;
  border-radius:5px;
  font-size:11px;
  font-weight:bold;
}

.vitals{
  display:grid;
  grid-template-columns:repeat(5,1fr);
  gap:8px;
  margin:12px 0;
}

.vital{
  background:#f4f7fb;
  border-radius:6px;
  padding:9px;
}

.section{
  margin-top:10px;
  padding-top:10px;
  border-top:1px solid #e5e7eb;
}

.sectionTitle{
  font-weight:bold;
  color:#123d88;
  margin-bottom:5px;
}

.rx{
  margin-top:8px;
}

.rx li{
  margin:6px 0;
}

.empty{
  color:#667085;
  padding:10px 0;
}

.actions{
  display:flex;
  gap:8px;
  flex-wrap:wrap;
  margin:12px 0;
}

@media(max-width:700px){

  .search{
    grid-template-columns:1fr;
  }

  .top{
    align-items:flex-start;
    flex-direction:column;
  }

  .vitals{
    grid-template-columns:1fr 1fr;
  }

  .visitTitle{
    flex-direction:column;
    align-items:flex-start;
  }
}

@media print{

  body{
    background:#fff;
  }

  .wrap{
    max-width:none;
    margin:0;
    padding:10px;
  }

  .noPrint{
    display:none !important;
  }

  .card{
    border:none;
  }

  .visit{
    break-inside:avoid;
  }
}
</style>
</head>

<body>

<main class="wrap">

<div class="top noPrint">

  <div>
    <h1 style="color:#123d88;margin:0">
      PRIME HOSPITAL
    </h1>

    <div>
      Patient Search & Complete History
    </div>
  </div>

  <div>

    <a class="btn" href="/app-v2.html">
      New Consultation
    </a>

    <button class="btn" onclick="logout()">
      Logout
    </button>

  </div>

</div>


<div
  id="status"
  class="muted"
  style="margin-top:10px"
></div>


<!-- SEARCH -->

<div
  id="searchArea"
  class="card noPrint"
  style="display:none"
>

  <h2 style="color:#123d88">
    Find Patient
  </h2>

  <div class="search">

    <input
      id="qname"
      placeholder="Patient name"
    >

    <input
      id="qmobile"
      placeholder="Mobile number"
    >

    <input
      id="quid"
      placeholder="UHID / Patient ID"
    >

    <button
      class="btn primary"
      onclick="searchPatients()"
    >
      Search
    </button>

  </div>

  <div id="results"></div>

</div>


<!-- HISTORY -->

<div
  id="history"
  class="card"
  style="display:none"
></div>


</main>


<script>

const SB_URL =
'https://prcvzefynoiuneybufge.supabase.co';

const SB_KEY =
'sb_publishable_JbxZuf181uR8zbmTyyfFiA_2pLjsq0C';

const sb =
supabase.createClient(SB_URL,SB_KEY);


/* PRINT DATA */

let patientForPrint = null;
let visitsForPrint = [];
let medicinesForPrint = [];


const $ = x =>
document.getElementById(x);


/* ESCAPE HTML */

function esc(s){

  return String(s ?? '')
    .replace(
      /[&<>"']/g,
      m => ({
        '&':'&amp;',
        '<':'&lt;',
        '>':'&gt;',
        '"':'&quot;',
        "'":'&#39;'
      }[m])
    );

}


/* INITIALIZE */

async function init(){

  let {
    data,
    error
  } = await sb.auth.getSession();

  if(error || !data.session){

    location.href='/app-v2.html';

    return;
  }

  $('searchArea').style.display='block';

}


/* LOGOUT */

async function logout(){

  await sb.auth.signOut();

  location.href='/app-v2.html';

}


/* SEARCH PATIENTS */

async function searchPatients(){

  let {
    data:{user}
  } = await sb.auth.getUser();

  if(!user) return;


  let qn =
    $('qname').value.trim();

  let qm =
    $('qmobile').value.trim();

  let qi =
    $('quid').value.trim();


  if(!qn && !qm && !qi){

    $('results').innerHTML =
      '<p class="muted">Enter patient name, mobile number or UHID.</p>';

    return;
  }


  let q =
    sb
      .from('patients')
      .select('*')
      .eq('doctor_id',user.id)
      .order('name');


  if(qn){

    q=q.ilike(
      'name',
      '%'+qn+'%'
    );

  }


  if(qm){

    q=q.ilike(
      'mobile',
      '%'+qm+'%'
    );

  }


  if(qi){

    q=q.ilike(
      'patient_id',
      '%'+qi+'%'
    );

  }


  let {
    data,
    error
  } = await q.limit(50);


  if(error){

    $('results').innerHTML =
      '<p>'+esc(error.message)+'</p>';

    return;
  }


  if(!data.length){

    $('results').innerHTML =
      '<p class="muted">No patient found.</p>';

    return;
  }


  $('results').innerHTML =

    data.map(p => `

      <div class="card">

        <b>${esc(p.name)}</b>

        <div class="muted">

          UHID:
          ${esc(p.patient_id || '—')}

          • Age:
          ${esc(p.age || '—')}

          •
          ${esc(p.gender || '')}

          • Mobile:
          ${esc(p.mobile || '—')}

        </div>


        <button
          class="btn primary"
          style="margin-top:8px"
          onclick="showHistory('${p.id}')"
        >
          View Complete History
        </button>

      </div>

    `).join('');

}


/* SHOW COMPLETE HISTORY */

async function showHistory(pid){

  $('history').style.display='block';

  $('history').innerHTML =
    '<p class="muted">Loading patient history...</p>';


  let {
    data:{user}
  } = await sb.auth.getUser();


  if(!user){

    location.href='/app-v2.html';

    return;
  }


  /* PATIENT */

  let {
    data:p,
    error:patientError
  } = await sb
    .from('patients')
    .select('*')
    .eq('id',pid)
    .eq('doctor_id',user.id)
    .single();


  if(patientError){

    $('history').innerHTML =
      '<p>'+esc(patientError.message)+'</p>';

    return;
  }


  /* VISITS */

  let {
    data:visits,
    error:visitError
  } = await sb
    .from('visits')
    .select('*')
    .eq('patient_id',pid)
    .eq('doctor_id',user.id)
    .order(
      'visit_date',
      {ascending:false}
    );


  if(visitError){

    $('history').innerHTML =
      '<p>'+esc(visitError.message)+'</p>';

    return;
  }


  visits = visits || [];


  /* PRESCRIPTIONS */

  let ids =
    visits.map(x => x.id);


  let meds = [];


  if(ids.length){

    let {
      data,
      error
    } = await sb
      .from('prescriptions')
      .select('*')
      .in('visit_id',ids)
      .order('sort_order');


    if(error){

      $('history').innerHTML =
        '<p>'+esc(error.message)+'</p>';

      return;
    }


    meds = data || [];

  }


  /* SAVE DATA FOR PRINT */

  patientForPrint = p;

  visitsForPrint = visits;

  medicinesForPrint = meds;


  /* PATIENT HEADER */

  let html = `

    <div class="patientHeader">

      <div class="patientName">
        ${esc(p.name)}
      </div>


      <div style="margin-top:6px">

        <b>UHID:</b>
        ${esc(p.patient_id || '—')}

        &nbsp; | &nbsp;

        <b>Age:</b>
        ${esc(p.age || '—')}

        &nbsp; | &nbsp;

        <b>Gender:</b>
        ${esc(p.gender || '—')}

        &nbsp; | &nbsp;

        <b>Mobile:</b>
        ${esc(p.mobile || '—')}

      </div>

    </div>


    <div class="actions noPrint">

      <button
        class="btn"
        onclick="backToSearch()"
      >
        ← Back to Search
      </button>


      <button
        class="btn primary"
        onclick="window.print()"
      >
        Print Patient History
      </button>

    </div>

  `;


  /* NO VISITS */

  if(!visits.length){

    html += `

      <div class="empty">
        No previous visits found for this patient.
      </div>

    `;

    $('history').innerHTML=html;

    return;
  }


  /* HISTORY TITLE */

  html += `

    <h2 style="color:#123d88">
      Complete Visit History
    </h2>

  `;


  /* EACH VISIT */

  visits.forEach((x,index)=>{

    let visitMeds =
      meds.filter(
        m => m.visit_id === x.id
      );


    let latest =
      index === 0;


    html += `

      <div
        class="visit ${latest ? 'latest' : ''}"
      >


        <div class="visitTitle">

          <div>

            <b>
              Visit Date:
              ${esc(x.visit_date || '—')}
            </b>

          </div>


          ${
            latest
            ?
            '<span class="latestBadge">LATEST VISIT</span>'
            :
            ''
          }

        </div>


        <!-- VITALS -->

        <div class="vitals">

          <div class="vital">
            <div class="muted">BP</div>
            <b>${esc(x.bp || '—')}</b>
          </div>


          <div class="vital">
            <div class="muted">Pulse</div>
            <b>${esc(x.pulse || '—')}</b>
          </div>


          <div class="vital">
            <div class="muted">SpO₂</div>
            <b>${esc(x.spo2 || '—')}</b>
          </div>


          <div class="vital">
            <div class="muted">Weight</div>
            <b>${esc(x.weight || '—')}</b>
          </div>


          <div class="vital">
            <div class="muted">Sugar</div>
            <b>${esc(x.blood_sugar || '—')}</b>
          </div>

        </div>


        <!-- COMPLAINTS -->

        <div class="section">

          <div class="sectionTitle">
            Complaints
          </div>

          <div>
            ${esc(x.complaints || '—')}
          </div>

        </div>


        <!-- DIAGNOSIS -->

        <div class="section">

          <div class="sectionTitle">
            Diagnosis
          </div>

          <div>
            ${esc(x.diagnosis || '—')}
          </div>

        </div>


        <!-- ADVICE -->

        <div class="section">

          <div class="sectionTitle">
            Advice / Treatment
          </div>

          <div>
            ${esc(x.advice || '—')}
          </div>

        </div>


        <!-- MEDICINES -->

        <div class="section">

          <div class="sectionTitle">
            Medicines Prescribed
          </div>


          ${
            visitMeds.length
            ?

            `<ol class="rx">

              ${
                visitMeds.map(m => `

                  <li>

                    <b>
                      ${esc(m.medicine_name || '')}
                    </b>

                    ${esc(m.strength || '')}

                    ${
                      m.frequency
                      ?
                      ' — '+esc(m.frequency)
                      :
                      ''
                    }

                    ${
                      m.duration
                      ?
                      ' — '+esc(m.duration)
                      :
                      ''
                    }

                    ${
                      m.instruction
                      ?
                      ' — '+esc(m.instruction)
                      :
                      ''
                    }

                  </li>

                `).join('')
              }

            </ol>`

            :

            '<div class="muted">No medicines recorded.</div>'

          }

        </div>


        <!-- PRINT BUTTON -->

        <div class="actions noPrint">

          <button
            class="btn primary"
            onclick="printVisit('${x.id}')"
          >
            View / Print Prescription
          </button>

        </div>


      </div>

    `;

  });


  $('history').innerHTML=html;


  window.scrollTo({
    top:document.body.scrollHeight,
    behavior:'smooth'
  });

}


/* BACK TO SEARCH */

function backToSearch(){

  $('history').style.display='none';

  $('results').scrollIntoView({
    behavior:'smooth'
  });

}


/* PRINT INDIVIDUAL PRESCRIPTION */

function printVisit(visitId){

  const visit =
    visitsForPrint.find(
      v => v.id === visitId
    );


  if(!visit){

    alert('Visit details not found.');

    return;
  }


  const patient =
    patientForPrint;


  const medicines =
    medicinesForPrint.filter(
      m => m.visit_id === visitId
    );


  const medicineRows =

    medicines.length

    ?

    medicines.map((m,i)=>`

      <tr>

        <td>
          ${i+1}
        </td>

        <td>

          <b>
            ${esc(m.medicine_name || '')}
          </b>

          ${esc(m.strength || '')}

        </td>

        <td>
          ${esc(m.frequency || '—')}
        </td>

        <td>
          ${esc(m.duration || '—')}
        </td>

        <td>
          ${esc(m.instruction || '—')}
        </td>

      </tr>

    `).join('')


    :

    `

      <tr>

        <td colspan="5">
          No medicines recorded.
        </td>

      </tr>

    `;


  const w = window.open(
    '',
    '_blank',
    'width=900,height=700'
  );


  if(!w){

    alert(
      'Please allow pop-ups for the Prime Hospital website.'
    );

    return;
  }


  w.document.write(`

}

  display:grid;

</head>


<body>

>
Print Prescription

  </h1>

  </div>

  <div>

  </div>

</div>


<div class="patient">

  <b>Patient:</b>

  &nbsp;&nbsp;&nbsp;

  <br><br>

  <b>Age:</b>

  &nbsp;&nbsp;&nbsp;

  ${esc(patient.mobile || '—')}

  <br><br>

  <b>Visit Date:</b>
  ${esc(visit.visit_date || '—')}

</div>


<div class="section">

  <h3>
    Vitals
  </h3>


  <div class="vitals">

    <div class="vital">
      <b>BP</b><br>
      ${esc(visit.bp || '—')}
    </div>

    <div class="vital">

      ${esc(visit.pulse || '—')}
    </div>

    <div class="vital">
      <b>SpO₂</b><br>
      ${esc(visit.spo2 || '—')}
    </div>

    <div class="vital">
      <b>Weight</b><br>
      ${esc(visit.weight || '—')}
    </div>

    <div class="vital">
      <b>Sugar</b><br>
      ${esc(visit.blood_sugar || '—')}
    </div>

  </div>

</div>


<div class="section">

  <h3>
    Complaints
  </h3>

  ${esc(visit.complaints || '—')}

</div>


<div class="section">

  <h3>
    Diagnosis
  </h3>

  ${esc(visit.diagnosis || '—')}

</div>


<div class="section">

  <h3>
    Medicines
  </h3>


  <table>

    <thead>

      <tr>

        <th>No.</th>

        <th>Medicine</th>

        <th>Frequency</th>

        <th>Duration</th>

        <th>Instructions</th>

      </tr>

    </thead>


    <tbody>

      ${medicineRows}

    </tbody>

  </table>

</div>


<div class="section">

  <h3>
    Advice / Treatment
  </h3>

  ${esc(visit.advice || '—')}

  `);


  w.document.close();

}


/* START APP */

init();

</script>

</body>
</html>
