<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Prime Hospital - Patients & History</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>body{font:14px Arial;margin:0;background:#f4f7fb;color:#172033}.wrap{max-width:1100px;margin:20px auto;padding:20px;background:#fff;border-radius:12px}.top{display:flex;justify-content:space-between;align-items:center;gap:10px}.brand{color:#123d88;text-decoration:none}.brand h1{margin:0}.btn{padding:9px 13px;border-radius:6px;border:1px solid #123d88;background:#fff;color:#123d88;font-weight:bold;cursor:pointer;text-decoration:none;display:inline-block}.primary{background:#123d88;color:#fff}.search{display:grid;grid-template-columns:1fr 1fr 1fr auto;gap:8px;margin:18px 0}.search input{padding:10px;border:1px solid #cfd7e3;border-radius:6px}.card{border:1px solid #dfe5ee;border-radius:9px;padding:14px;margin:10px 0}.patient{display:flex;justify-content:space-between;align-items:center;gap:10px}.patientName{font-size:19px;font-weight:bold;color:#123d88}.muted{color:#667085;font-size:12px}.visit{border:1px solid #dfe5ee;border-radius:9px;padding:15px;margin:14px 0}.latest{border:2px solid #123d88}.vitals{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin:12px 0}.vital{background:#f4f7fb;border-radius:6px;padding:9px}.section{margin-top:10px;padding-top:10px;border-top:1px solid #e5e7eb}.title{font-weight:bold;color:#123d88;margin-bottom:5px}.actions{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}.error{color:#b42318;background:#fff1f0;border:1px solid #f0b8b2;padding:10px;border-radius:6px}.hidden{display:none}@media(max-width:700px){.search{grid-template-columns:1fr}.top,.patient{align-items:flex-start;flex-direction:column}.vitals{grid-template-columns:1fr 1fr}}</style></head><body><main class="wrap"><div class="top"><a class="brand" href="/" title="Home"><h1>PRIME HOSPITAL</h1><div>Patients & Complete History</div></a><div class="actions"><a class="btn" href="/app-v2.html">New Consultation</a><a class="btn" href="/">Home</a></div></div><div id="status" class="muted">Loading...</div><section id="searchBox" class="card hidden"><h2 style="color:#123d88">Patients</h2><div class="search"><input id="name" placeholder="Patient name"><input id="mobile" placeholder="Mobile"><input id="uhid" placeholder="UHID / Patient ID"><button class="btn primary" onclick="search()">Search</button></div><div class="muted">Leave all fields empty and press Search to show all patients.</div><div id="results"></div></section><section id="history" class="card hidden"></section></main><script>const URL='https://prcvzefynoiuneybufge.supabase.co',KEY='sb_publishable_JbxZuf181uR8zbmTyyfFiA_2pLjsq0C',sb=supabase.createClient(URL,KEY);const $=x=>document.getElementById(x);const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));let current=null;async function init(){try{const {data,error}=await sb.auth.getSession();if(error)throw error;if(!data.session){$('status').innerHTML='<div class="error">You are not logged in. Please open New Consultation and log in first.</div>';return}$('status').textContent='';$('searchBox').classList.remove('hidden');await search()}catch(e){$('status').innerHTML='<div class="error">'+esc(e.message||'Unable to connect.')+'</div>'}}async function search(){const r=$('results');r.innerHTML='<p class="muted">Searching...</p>';try{const {data:{user},error:ue}=await sb.auth.getUser();if(ue)throw ue;if(!user)throw new Error('Session expired. Please log in again.');let q=sb.from('patients').select('*').eq('doctor_id',user.id).order('name').limit(100);const n=$('name').value.trim(),m=$('mobile').value.trim(),u=$('uhid').value.trim();if(n)q=q.ilike('name','%'+n+'%');if(m)q=q.ilike('mobile','%'+m+'%');if(u)q=q.ilike('patient_id','%'+u+'%');const {data,error}=await q;if(error)throw error;if(!data?.length){r.innerHTML='<p class="muted">No patients found.</p>';return}r.innerHTML=data.map(p=>`<div class="card patient"><div><div class="patientName">${esc(p.name)}</div><div class="muted">UHID: ${esc(p.patient_id||'—')} • Age: ${esc(p.age||'—')} • ${esc(p.gender||'—')} • Mobile: ${esc(p.mobile||'—')}</div></div><button class="btn primary" onclick="history('${p.id}')">View History</button></div>`).join('')}catch(e){r.innerHTML='<div class="error">'+esc(e.message||'Patient search failed.')+'</div>'}}async function history(pid){const h=$('history');h.classList.remove('hidden');h.innerHTML='<p class="muted">Loading history...</p>';try{const {data:{user},error:ue}=await sb.auth.getUser();if(ue)throw ue;const {data:p,error:pe}=await sb.from('patients').select('*').eq('id',pid).eq('doctor_id',user.id).single();if(pe)throw pe;const {data:vs,error:ve}=await sb.from('visits').select('*').eq('patient_id',pid).eq('doctor_id',user.id).order('visit_date',{ascending:false});if(ve)throw ve;const ids=(vs||[]).map(v=>v.id);let meds=[];if(ids.length){const {data,error}=await sb.from('prescriptions').select('*').in('visit_id',ids);if(error)throw error;meds=data||[]}current={p,vs:vs||[],meds};let out=`<div class="patientName">${esc(p.name)}</div><div class="muted">UHID: ${esc(p.patient_id||'—')} • Age: ${esc(p.age||'—')} • ${esc(p.gender||'—')} • Mobile: ${esc(p.mobile||'—')}</div><div class="actions"><button class="btn" onclick="$('history').classList.add('hidden')">← Back</button><a class="btn primary" href="/app-v2.html?patient_id=${encodeURIComponent(p.id)}">Start Follow-up</a><button class="btn" onclick="window.print()">Print History</button></div><h2 style="color:#123d88">Visit History</h2>`;if(!vs?.length)out+='<p class="muted">No visits recorded for this patient.</p>';(vs||[]).forEach((v,i)=>{const ms=meds.filter(x=>x.visit_id===v.id);out+=`<div class="visit ${i===0?'latest':''}"><b>Visit: ${esc(v.visit_date||'—')}</b>${i===0?' <small>Latest</small>':''}<div class="vitals"><div class="vital"><span class="muted">BP</span><br><b>${esc(v.bp||'—')}</b></div><div class="vital"><span class="muted">Pulse</span><br><b>${esc(v.pulse||'—')}</b></div><div class="vital"><span class="muted">SpO₂</span><br><b>${esc(v.spo2||'—')}</b></div><div class="vital"><span class="muted">Weight</span><br><b>${esc(v.weight||'—')}</b></div><div class="vital"><span class="muted">Sugar</span><br><b>${esc(v.blood_sugar||'—')}</b></div></div><div class="section"><div class="title">Complaints</div>${esc(v.complaints||'—')}</div><div class="section"><div class="title">Diagnosis</div>${esc(v.diagnosis||'—')}</div><div class="section"><div class="title">Medicines</div>${ms.length?'<ol>'+ms.map(x=>`<li><b>${esc(x.medicine_name||'')}</b> ${esc(x.strength||'')} — ${esc(x.frequency||'')} — ${esc(x.duration||'')} ${x.instruction?' — '+esc(x.instruction):''}</li>`).join('')+'</ol>':'<span class="muted">No medicines recorded.</span>'}</div><div class="section"><div class="title">Advice / Treatment</div>${esc(v.advice||'—')}</div><div class="actions"><a class="btn primary" href="/app-v2.html?patient_id=${encodeURIComponent(p.id)}&copy_visit_id=${encodeURIComponent(v.id)}">Repeat Prescription</a></div></div>`});h.innerHTML=out;h.scrollIntoView({behavior:'smooth'})}catch(e){h.innerHTML='<div class="error">'+esc(e.message||'Unable to load patient history.')+'</div>'}}init();</script></body></html>
