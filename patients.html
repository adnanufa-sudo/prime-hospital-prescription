<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Prime Hospital - Patients</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>body{font:14px Arial;margin:0;background:#f4f7fb;color:#172033}.wrap{max-width:1100px;margin:20px auto;padding:20px;background:#fff;border-radius:12px}.top{display:flex;justify-content:space-between;align-items:center;gap:10px}.btn{padding:9px 13px;border-radius:6px;border:1px solid #123d88;background:#fff;color:#123d88;font-weight:bold;cursor:pointer}.primary{background:#123d88;color:#fff}.danger{color:#b42318;border-color:#b42318}.search{display:grid;grid-template-columns:1fr 1fr 1fr auto;gap:8px;margin:18px 0}.search input{padding:10px;border:1px solid #cfd7e3;border-radius:6px}.card{border:1px solid #dfe5ee;border-radius:9px;padding:14px;margin:10px 0}.muted{color:#667085;font-size:12px}.visit{border-top:1px solid #dfe5ee;padding:12px 0}.rx{margin-top:8px;padding-left:14px}@media(max-width:700px){.search{grid-template-columns:1fr}.top{align-items:flex-start;flex-direction:column}}</style></head><body><main class="wrap"><div class="top"><div><h1 style="color:#123d88;margin:0">PRIME HOSPITAL</h1><div>Patient Search & History</div></div><div><a class="btn" href="/app-v2.html">New Consultation</a> <button class="btn" onclick="logout()">Logout</button></div></div><div id="status" class="muted" style="margin-top:10px"></div><div id="searchArea" class="card" style="display:none"><h2 style="color:#123d88">Find Patient</h2><div class="search"><input id="qname" placeholder="Patient name"><input id="qmobile" placeholder="Mobile number"><input id="quid" placeholder="UHID / Patient ID"><button class="btn primary" onclick="searchPatients()">Search</button></div><div id="results"></div></div><div id="history" class="card" style="display:none"></div></main><script>const SB_URL='https://prcvzefynoiuneybufge.supabase.co';const SB_KEY='sb_publishable_JbxZuf181uR8zbmTyyfFiA_2pLjsq0C';const sb=supabase.createClient(SB_URL,SB_KEY);const $=x=>document.getElementById(x);function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}async function init(){let {data}=await sb.auth.getSession();if(!data.session){location.href='/app-v2.html';return}$('searchArea').style.display='block'}async function logout(){await sb.auth.signOut();location.href='/app-v2.html'}async function searchPatients(){let {data:{user}}=await sb.auth.getUser();if(!user)return;let qn=$('qname').value.trim(),qm=$('qmobile').value.trim(),qi=$('quid').value.trim();let q=sb.from('patients').select('*').eq('doctor_id',user.id).order('name');if(qn)q=q.ilike('name','%'+qn+'%');if(qm)q=q.ilike('mobile','%'+qm+'%');if(qi)q=q.ilike('patient_id','%'+qi+'%');let {data,error}=await q.limit(50);if(error){$('results').innerHTML='<p>'+esc(error.message)+'</p>';return}if(!data.length){$('results').innerHTML='<p class="muted">No patient found.</p>';return}$('results').innerHTML=data.map(p=>`<div class="card"><b>${esc(p.name)}</b><div class="muted">UHID: ${esc(p.patient_id||'—')} • Age: ${esc(p.age||'—')} • ${esc(p.gender||'')} • Mobile: ${esc(p.mobile||'—')}</div><button class="btn primary" style="margin-top:8px" onclick="showHistory('${p.id}')">View Previous Visits</button></div>`).join('')}async function showHistory(pid){let {data:{user}}=await sb.auth.getUser();let p=await sb.from('patients').select('*').eq('id',pid).eq('doctor_id',user.id).single();if(p.error)return;let v=await sb.from('visits').select('*').eq('patient_id',pid).eq('doctor_id',user.id).order('visit_date',{ascending:false});if(v.error){$('history').innerHTML='<p>'+esc(v.error.message)+'</p>';return}let ids=(v.data||[]).map(x=>x.id);let r=ids.length?await sb.from('prescriptions').select('*').in('visit_id',ids).order('sort_order'):({data:[]});let meds=r.data||[];$('history').style.display='block';$('history').innerHTML=`<h2 style="color:#123d88">${esc(p.data.name)} — History</h2><div class="muted">UHID: ${esc(p.data.patient_id||'—')} • ${esc(p.data.age||'')} • ${esc(p.data.gender||'')} • ${esc(p.data.mobile||'')}</div>`+(v.data||[]).map(x=>`<div class="visit"><b>Visit: ${esc(x.visit_date)}</b><div>BP: ${esc(x.bp||'—')} | Pulse: ${esc(x.pulse||'—')} | SpO₂: ${esc(x.spo2||'—')} | Weight: ${esc(x.weight||'—')} | Sugar: ${esc(x.blood_sugar||'—')}</div><div><b>Diagnosis:</b> ${esc(x.diagnosis||'—')}</div><div><b>Complaints:</b> ${esc(x.complaints||'—')}</div><div><b>Advice:</b> ${esc(x.advice||'—')}</div><div class="rx"><b>Medicines:</b><ul>`+meds.filter(m=>m.visit_id===x.id).map(m=>`<li>${esc(m.medicine_name)} ${esc(m.strength||'')} — ${esc(m.frequency||'')} — ${esc(m.duration||'')} — ${esc(m.instruction||'')}</li>`).join('')+`</ul></div></div>`).join('')||'<p class="muted">No previous visits.</p>';window.scrollTo({top:document.body.scrollHeight,behavior:'smooth'})}init();</script></body></html>
