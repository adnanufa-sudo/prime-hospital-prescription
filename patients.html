<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Prime Hospital - Patients</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>body{font:14px Arial;margin:0;background:#f4f7fb;color:#172033}.wrap{max-width:900px;margin:20px auto;padding:20px;background:#fff;border-radius:12px}.top{display:flex;justify-content:space-between;align-items:center}.brand{text-decoration:none;color:#123d88}.brand h1{margin:0}.btn{padding:9px 13px;border:1px solid #123d88;border-radius:6px;background:#fff;color:#123d88;font-weight:bold;text-decoration:none;cursor:pointer}.primary{background:#123d88;color:#fff}.search{display:flex;gap:8px;margin:18px 0}.search input{flex:1;padding:11px;border:1px solid #ccd4df;border-radius:6px}.patient{border:1px solid #dfe5ee;border-radius:10px;margin:10px 0;overflow:hidden}.patientHead{padding:14px;background:#f7f9fc;display:flex;justify-content:space-between;align-items:center;cursor:pointer}.name{font-size:18px;font-weight:bold;color:#123d88}.history{display:none;padding:12px}.patient.open .history{display:block}.visit{border-top:1px solid #e5e7eb}.visit summary{padding:12px;cursor:pointer;font-weight:bold;color:#123d88}.details{padding:0 12px 12px}.row{padding:5px 0}.error{padding:12px;background:#fff1f0;color:#b42318;border:1px solid #f0b8f2;border-radius:6px}.muted{color:#667085;font-size:12px}@media(max-width:650px){.top{align-items:flex-start;gap:10px;flex-direction:column}.search{flex-direction:column}}</style></head><body><main class="wrap"><div class="top"><a class="brand" href="/"><h1>PRIME HOSPITAL</h1><div>Patients & History</div></a><a class="btn primary" href="/app-v2.html">＋ New Consultation</a></div><div class="search"><input id="q" placeholder="Search patient name, mobile or UHID"><button class="btn" onclick="loadPatients()">Search</button></div><div id="status" class="muted">Loading patients...</div><div id="list"></div></main><script>const sb=supabase.createClient('https://prcvzefynoiuneybufge.supabase.co','sb_publishable_JbxZuf181uR8zbmTyyfFiA_2pLjsq0C');const $=id=>document.getElementById(id);const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));async function loadPatients(){ $('status').textContent='Loading patients...';$('list').innerHTML='';try{const {data:{user},error:ue}=await sb.auth.getUser();if(ue)throw ue;if(!user){$('status').innerHTML='<div class="error">Please log in first. <a href="/app-v2.html">Open New Consultation</a></div>';return}let q=sb.from('patients').select('id,name,age,gender,mobile,patient_id').eq('doctor_id',user.id).order('name').limit(100);const term=$('q').value.trim();if(term)q=q.or('name.ilike.%'+term+'%,mobile.ilike.%'+term+'%,patient_id.ilike.%'+term+'%');const {data:ps,error}=await q;if(error)throw error;if(!ps?.length){$('status').textContent=term?'No patient found.':'No patients yet.';return}$('status').textContent=ps.length+' patient'+(ps.length===1?'':'s');ps.forEach(p=>{const box=document.createElement('div');box.className='patient';box.innerHTML='<div class="patientHead"><div><div class="name">'+esc(p.name)+'</div><div class="muted">Age '+esc(p.age||'—')+' · '+esc(p.gender||'—')+' · UHID '+esc(p.patient_id||'—')+'</div></div><span>▼</span></div><div class="history"><div class="muted">Loading visits...</div></div>';$('list').appendChild(box);box.querySelector('.patientHead').onclick=()=>togglePatient(box,p.id,user.id)})}catch(e){$('status').innerHTML='<div class="error">Unable to load patients: '+esc(e.message||e)+'</div>'}}async function togglePatient(box,pid,uid){if(box.classList.contains('open')){box.classList.remove('open');return}box.classList.add('open');const h=box.querySelector('.history');try{const {data:vs,error}=await sb.from('visits').select('id,visit_date,complaints,diagnosis,advice,bp,pulse,spo2,weight,blood_sugar').eq('patient_id',pid).eq('doctor_id',uid).order('visit_date',{ascending:false});if(error)throw error;if(!vs?.length){h.innerHTML='<div class="muted">No visits recorded.</div>';return}h.innerHTML=vs.map((v,i)=>'<details class="visit" '+(i===0?'open':'')+'><summary>'+esc(v.visit_date||'Date not recorded')+(i===0?' · LATEST':'')+'</summary><div class="details"><div class="row"><b>Complaints:</b> '+esc(v.complaints||'—')+'</div><div class="row"><b>Diagnosis:</b> '+esc(v.diagnosis||'—')+'</div><div class="row"><b>Advice:</b> '+esc(v.advice||'—')+'</div><div class="row"><b>Vitals:</b> BP '+esc(v.bp||'—')+' · Pulse '+esc(v.pulse||'—')+' · SpO₂ '+esc(v.spo2||'—')+' · Weight '+esc(v.weight||'—')+' · Sugar '+esc(v.blood_sugar||'—')+'</div><div class="row"><a class="btn" href="/app-v2.html?patient_id='+encodeURIComponent(pid)+'&copy_visit_id='+encodeURIComponent(v.id)+'">Repeat Prescription</a> <a class="btn primary" href="/app-v2.html?patient_id='+encodeURIComponent(pid)+'&followup=1">New Consultation</a></div></div></details>').join('')}catch(e){h.innerHTML='<div class="error">Unable to load visits: '+esc(e.message||e)+'</div>'}}$('q').addEventListener('keydown',e=>{if(e.key==='Enter')loadPatients()});loadPatients();</script></body></html>
