<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Prime Hospital - New Consultation</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>body{font:14px Arial;background:#f4f7fb;margin:0;color:#172033}.wrap{max-width:1000px;margin:20px auto;background:#fff;padding:20px;border-radius:12px}h1,h2{color:#123d88}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.field label{display:block;font-size:11px;font-weight:bold;margin-bottom:4px}.field input,.field textarea,.field select{width:100%;padding:8px;border:1px solid #ccd4df;border-radius:5px;box-sizing:border-box}.wide{grid-column:1/-1}.section{border-top:1px solid #dfe5ee;padding-top:12px;margin-top:15px}.btn{padding:9px 13px;border:1px solid #123d88;border-radius:6px;background:#fff;color:#123d88;font-weight:bold;cursor:pointer}.primary{background:#123d88;color:#fff}.muted{color:#667085;font-size:12px}.med{display:grid;grid-template-columns:2fr 1fr 1fr 1fr 2fr auto;gap:5px;margin:6px 0}.med input{padding:7px;border:1px solid #ccd4df}.suggest{position:absolute;background:#fff;border:1px solid #ccd4df;z-index:5;width:30%;max-height:180px;overflow:auto}.suggest div{padding:8px;cursor:pointer}.suggest div:hover{background:#eef4ff}@media(max-width:700px){.grid{grid-template-columns:1fr 1fr}.med{grid-template-columns:1fr 1fr}}@media print{.no-print{display:none!important}body{background:#fff}.wrap{margin:0;width:148mm;min-height:210mm;padding:8mm}}
</style></head><body><main class="wrap"><div style="display:flex;justify-content:space-between;align-items:center"><a href="/" style="text-decoration:none;color:#123d88"><h1>PRIME HOSPITAL</h1></a><a class="btn no-print" href="/patients.html">← Patient History</a></div><div id="status" class="muted">Loading patient...</div><div class="section"><h2>Patient Information</h2><div class="grid"><div class="field"><label>UHID</label><input id="pid" readonly></div><div class="field wide"><label>Name</label><input id="name" readonly></div><div class="field"><label>Age</label><input id="age" readonly></div><div class="field"><label>Gender</label><input id="gender" readonly></div><div class="field"><label>Mobile</label><input id="phone" readonly></div><div class="field"><label>Date</label><input id="date" type="date"></div></div></div><div class="section"><h2>Vitals</h2><div class="grid"><div class="field"><label>BP</label><input id="bp"></div><div class="field"><label>Pulse</label><input id="pulse"></div><div class="field"><label>SpO₂</label><input id="spo"></div><div class="field"><label>Temperature</label><input id="temp"></div><div class="field"><label>Weight</label><input id="weight"></div><div class="field"><label>Blood Sugar</label><input id="sugar"></div></div></div><div class="section"><h2>Complaints / Examination</h2><textarea id="complaints" rows="3" style="width:100%"></textarea></div><div class="section"><h2>Diagnosis</h2><input id="diagnosis" style="width:100%"></div><div class="section"><h2>Prescription</h2><div id="meds"></div><button class="btn primary no-print" onclick="addMed()">＋ Add Medicine</button></div><div class="section"><h2>Advice / Follow-up</h2><textarea id="advice" rows="4" style="width:100%"></textarea></div><div class="no-print" style="text-align:right;margin-top:15px"><button class="btn primary" onclick="saveVisit()">Save to Cloud</button><button class="btn" onclick="saveVisit(true)">Save & Print</button></div></main><script>const sb=supabase.createClient('https://prcvzefynoiuneybufge.supabase.co','sb_publishable_JbxZuf181uR8zbmTyyfFiA_2pLjsq0C');const $=x=>document.getElementById(x),esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));let cache=[];function addMed(m={}){let d=document.createElement('div');d.className='med';d.innerHTML='<div style="position:relative"><input class="mn" placeholder="Type medicine" value="'+esc(m.medicine_name||m.name||'')+'"><div class="suggest"></div></div><input class="st" placeholder="Strength" value="'+esc(m.strength||'')+'"><input class="fr" placeholder="1-0-1" value="'+esc(m.frequency||m.default_frequency||'')+'"><input class="du" placeholder="Duration" value="'+esc(m.duration||m.default_duration||'')+'"><input class="in" placeholder="Instruction" value="'+esc(m.instruction||m.default_instruction||'')+'"><button class="btn" onclick="this.parentElement.remove()">×</button>';$("meds").appendChild(d);let i=d.querySelector('.mn'),s=d.querySelector('.suggest');i.oninput=()=>{let q=i.value.toLowerCase().trim();if(!q){s.innerHTML='';return}let a=cache.filter(x=>((x.name||'')+' '+(x.strength||'')+' '+(x.default_frequency||'')).toLowerCase().includes(q)).slice(0,10);s.innerHTML=a.map(x=>'<div><b>'+esc(x.name)+'</b> '+esc(x.strength||'')+'</div>').join('');s.querySelectorAll('div').forEach((el,k)=>el.onclick=()=>{let x=a[k];i.value=x.name;d.querySelector('.st').value=x.strength||'';d.querySelector('.fr').value=x.default_frequency||'';d.querySelector('.du').value=x.default_duration||'';d.querySelector('.in').value=x.default_instruction||'';s.innerHTML=''})};}async function init(){let {data:{user}}=await sb.auth.getUser();if(!user){$('status').textContent='Please log in from New Consultation first.';return}let u=new URLSearchParams(location.search),pid=u.get('patient_id'),copy=u.get('copy_visit_id');if(!pid){$('status').textContent='No patient selected.';return}let {data:p,error}=await sb.from('patients').select('*').eq('id',pid).eq('doctor_id',user.id).single();if(error){$('status').textContent=error.message;return}$('pid').value=p.patient_id||'';$('name').value=p.name||'';$('age').value=p.age||'';$('gender').value=p.gender||'';$('phone').value=p.mobile||'';$('date').value=new Date().toISOString().slice(0,10);let mr=await sb.from('medicines').select('*').eq('doctor_id',user.id).order('name');cache=mr.data||[];if(copy){let v=await sb.from('visits').select('*').eq('id',copy).eq('patient_id',pid).single();if(v.data){['bp','pulse','spo','temp','weight','sugar','complaints','diagnosis','advice'].forEach(k=>{let db={spo:'spo2',temp:'temperature',sugar:'blood_sugar'}[k]||k;if($(k))$(k).value=v.data[db]||''});let pr=await sb.from('prescriptions').select('*').eq('visit_id',copy).order('sort_order');(pr.data||[]).forEach(x=>addMed(x))}}else addMed();$('status').textContent='Patient loaded — enter today’s consultation.'}async function saveVisit(print=false){let {data:{user}}=await sb.auth.getUser();if(!user)return;let pid=new URLSearchParams(location.search).get('patient_id');let v=await sb.from('visits').insert({doctor_id:user.id,patient_id:pid,visit_date:$('date').value,bp:$('bp').value,pulse:$('pulse').value,spo2:$('spo').value,temperature:$('temp').value,weight:$('weight').value,blood_sugar:$('sugar').value,complaints:$('complaints').value,diagnosis:$('diagnosis').value,advice:$('advice').value}).select('id').single();if(v.error){$('status').textContent=v.error.message;return}let rows=[...$('meds').children].map((r,i)=>({doctor_id:user.id,visit_id:v.data.id,medicine_name:r.querySelector('.mn').value,strength:r.querySelector('.st').value,frequency:r.querySelector('.fr').value,duration:r.querySelector('.du').value,instruction:r.querySelector('.in').value,sort_order:i})).filter(x=>x.medicine_name);if(rows.length){let r=await sb.from('prescriptions').insert(rows);if(r.error){$('status').textContent=r.error.message;return}}$('status').textContent='Saved securely.';if(print)window.print()}init();</script></body></html>
