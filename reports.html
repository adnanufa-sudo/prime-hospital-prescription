<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Prime Hospital - Reports</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>*{box-sizing:border-box}body{font:14px Arial;margin:0;background:#f4f7fb;color:#172033}.wrap{max-width:1100px;margin:20px auto;padding:20px;background:#fff;border-radius:12px}.top{display:flex;justify-content:space-between;align-items:center;gap:10px}.btn{padding:9px 13px;border-radius:6px;border:1px solid #123d88;background:#fff;color:#123d88;font-weight:bold;text-decoration:none;cursor:pointer}.primary{background:#123d88;color:#fff}.filters{display:flex;gap:8px;align-items:end;flex-wrap:wrap;margin:18px 0}.filters input{padding:10px;border:1px solid #cfd7e3;border-radius:6px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.stat,.card{border:1px solid #dfe5ee;border-radius:9px;padding:15px;margin:12px 0;background:#fff}.num{font-size:28px;font-weight:bold;color:#123d88}.muted{color:#667085;font-size:12px}.error{color:#b42318}table{width:100%;border-collapse:collapse}th,td{padding:9px;border-bottom:1px solid #e5e7eb;text-align:left}@media(max-width:700px){.top{flex-direction:column;align-items:flex-start}.stats{grid-template-columns:1fr}.filters{display:grid;grid-template-columns:1fr}}@media print{.noPrint{display:none!important}.wrap{margin:0;max-width:none}}</style></head><body><main class="wrap"><div class="top"><div><h1 style="color:#123d88;margin:0">PRIME HOSPITAL</h1><div>Clinical Reports</div></div><div class="noPrint"><a class="btn" href="/dashboard.html">Dashboard</a> <button class="btn" onclick="window.print()">Print</button></div></div><div class="filters noPrint"><div><div class="muted">From</div><input id="from" type="date"></div><div><div class="muted">To</div><input id="to" type="date"></div><button class="btn primary" onclick="load()">Generate Report</button></div><div class="stats"><div class="stat">Visits<div id="visits" class="num">—</div></div><div class="stat">Unique Patients<div id="unique" class="num">—</div></div><div class="stat">New Patients<div id="newp" class="num">—</div></div></div><div id="summary" class="card">Loading...</div></main><script>const SB_URL='https://prcvzefynoiuneybufge.supabase.co',SB_KEY='sb_publishable_JbxZuf181uR8zbmTyyfFiA_2pLjsq0C',sb=supabase.createClient(SB_URL,SB_KEY),$=x=>document.getElementById(x);function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}function d(){return new Date().toISOString().slice(0,10)}async function init(){let{data}=await sb.auth.getSession();if(!data.session){location.href='/app-v2.html';return}let t=d();$('from').value=t;$('to').value=t;load()}async function load(){let{data:{user}}=await sb.auth.getUser();if(!user)return;let f=$('from').value,t=$('to').value;if(!f||!t){$('summary').innerHTML='<span class="error">Select both dates.</span>';return}let{data:vs,error}=await sb.from('visits').select('id,patient_id,visit_date,diagnosis').eq('doctor_id',user.id).gte('visit_date',f).lte('visit_date',t).order('visit_date',{ascending:false});if(error){$('summary').innerHTML='<span class="error">'+esc(error.message)+'</span>';return}vs=vs||[];let ids=[...new Set(vs.map(v=>v.patient_id))];let{data:ps}=ids.length?await sb.from('patients').select('id,created_at,name,patient_id').eq('doctor_id',user.id).in('id',ids):{data:[]};let unique=ids.length;let newp=(ps||[]).filter(p=>p.created_at&&p.created_at.slice(0,10)>=f&&p.created_at.slice(0,10)<=t).length;$('visits').textContent=vs.length;$('unique').textContent=unique;$('newp').textContent=newp;let by={};vs.forEach(v=>by[v.visit_date]=(by[v.visit_date]||0)+1);let rows=Object.entries(by).sort((a,b)=>b[0].localeCompare(a[0])).map(x=>`<tr><td>${esc(x[0])}</td><td>${x[1]}</td></tr>`).join('');$('summary').innerHTML=`<h2 style="color:#123d88;margin-top:0">Visit Summary</h2><div class="muted">${esc(f)} to ${esc(t)}</div><table><thead><tr><th>Date</th><th>Visits</th></tr></thead><tbody>${rows||'<tr><td colspan="2">No visits in this period.</td></tr>'}</tbody></table>`}init();</script></body></html>
