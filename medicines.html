<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Prime Hospital - Medicine Library</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>body{font:14px Arial;margin:0;background:#f4f7fb;color:#172033}.wrap{max-width:1000px;margin:20px auto;padding:20px;background:#fff;border-radius:12px}.top{display:flex;justify-content:space-between;align-items:center;gap:10px}.btn{padding:9px 13px;border-radius:6px;border:1px solid #123d88;background:#fff;color:#123d88;font-weight:bold;cursor:pointer}.primary{background:#123d88;color:#fff}.fields{display:grid;grid-template-columns:1fr 1fr 1fr auto;gap:8px}.fields input,.fields select{padding:10px;border:1px solid #cfd7e3;border-radius:6px}.card{border:1px solid #dfe5ee;border-radius:9px;padding:14px;margin:12px 0}.item{display:flex;justify-content:space-between;gap:10px;align-items:center;border-bottom:1px solid #e5e7eb;padding:12px 0}.muted{color:#667085;font-size:12px}.hint{background:#eef4ff;padding:10px;border-radius:7px;margin-bottom:10px}@media(max-width:700px){.fields{grid-template-columns:1fr}.top,.item{align-items:flex-start;flex-direction:column}}</style></head><body><main class="wrap"><div class="top"><div><h1 style="color:#123d88;margin:0">PRIME HOSPITAL</h1><div>Medicine Library</div></div><div><a class="btn" href="/app-v2.html">New Consultation</a><a class="btn" href="/patients.html">History</a></div></div><div class="card"><h2 style="color:#123d88">Add Medicine</h2><div class="fields"><input id="brand" placeholder="Brand Name"><input id="formulation" placeholder="Formulation + Dosage (e.g. Tab 500 mg)"><select id="timing"><option>1-0-0</option><option>0-1-0</option><option>0-0-1</option><option>1-0-1</option><option>1-1-1</option><option>1-1-0</option><option>0-1-1</option><option>HS</option><option>SOS</option><option>Before food</option><option>After food</option></select><button class="btn primary" onclick="add()">Add</button></div><p id="status" class="muted"></p></div><div class="card"><h2 style="color:#123d88;margin-top:0">Search Medicines</h2><div class="hint"><b>Search every word:</b> you can type any part of the brand, formulation, dosage or timing. For example <b>tab</b>, <b>syr</b>, <b>cap</b>, <b>500</b>, <b>mg</b>, or multiple words such as <b>tab 500</b>.</div><input id="search" placeholder="Search any word: brand / tab / cap / syr / dosage / timing" style="width:100%;padding:10px;border:1px solid #cfd7e3;border-radius:6px;box-sizing:border-box" oninput="render()"><div id="list"></div></div></main><script>const key='prime_hospital_medicine_library';let meds=JSON.parse(localStorage.getItem(key)||'[]');function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}function save(){localStorage.setItem(key,JSON.stringify(meds))}function add(){let brand=document.getElementById('brand').value.trim(),form=document.getElementById('formulation').value.trim(),tim=document.getElementById('timing').value;if(!brand||!form){document.getElementById('status').textContent='Enter Brand Name and Formulation + Dosage.';return}meds.push({id:Date.now(),brand,form,tim});save();document.getElementById('brand').value='';document.getElementById('formulation').value='';document.getElementById('status').textContent='Medicine added.';render()}function remove(id){meds=meds.filter(x=>x.id!==id);save();render()}function render(){let q=document.getElementById('search').value.toLowerCase().trim();let words=q.split(/\s+/).filter(Boolean);let a=meds.filter(x=>{let text=(x.brand+' '+x.form+' '+x.tim).toLowerCase();return words.every(word=>text.includes(word))});document.getElementById('list').innerHTML=a.length?a.map(x=>`<div class="item"><div><b>${esc(x.brand)}</b><div class="muted">${esc(x.form)} • ${esc(x.tim)}</div></div><button class="btn" onclick="remove(${x.id})">Delete</button></div>`).join(''):'<p class="muted">No medicines saved.</p>'}render();</script></body></html>
