<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Prime Hospital - Register Patient</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>*{box-sizing:border-box}body{font:14px Arial;margin:0;background:#f4f7fb;color:#172033}.wrap{max-width:800px;margin:25px auto;padding:20px;background:#fff;border-radius:12px}.top{display:flex;justify-content:space-between;align-items:center;gap:10px}.btn{padding:10px 14px;border-radius:6px;border:1px solid #123d88;background:#fff;color:#123d88;font-weight:bold;cursor:pointer;text-decoration:none}.primary{background:#123d88;color:#fff}.fields{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:15px}.field label{display:block;font-weight:bold;font-size:12px;margin-bottom:5px}.field input,.field select{width:100%;padding:10px;border:1px solid #cfd7e3;border-radius:6px}.wide{grid-column:1/-1}.card{border:1px solid #dfe5ee;border-radius:9px;padding:18px;margin-top:18px}.uhid{background:#eef4ff;border:1px solid #cbd9f5;padding:12px;border-radius:8px}.status{margin-top:12px}.error{color:#b42318}.success{color:#067647}@media(max-width:650px){.fields{grid-template-columns:1fr}.wide{grid-column:auto}.top{flex-direction:column;align-items:flex-start}}</style></head><body><main class="wrap"><div class="top"><div><h1 style="color:#123d88;margin:0">PRIME HOSPITAL</h1><div>New Patient Registration</div></div><div><a class="btn" href="/patients.html">Patient History</a> <a class="btn" href="/app-v2.html">New Consultation</a></div></div><div class="card"><div class="uhid"><b>Automatic UHID</b><div id="uhid" style="font-size:18px;color:#123d88;margin-top:5px">Generating...</div></div><div class="fields"><div class="field wide"><label>Patient Name *</label><input id="name" autocomplete="name"></div><div class="field"><label>Age</label><input id="age" type="number" min="0" max="130"></div><div class="field"><label>Gender</label><select id="gender"><option value="Male">Male</option><option value="Female">Female</option><option value="Other">Other</option></select></div><div class="field"><label>Mobile</label><input id="mobile" inputmode="numeric" maxlength="15" autocomplete="tel"></div></div><div style="margin-top:18px"><button class="btn primary" onclick="register()">Register Patient & Start Consultation</button></div><div id="status" class="status muted"></div></div></main><script>const SB_URL='https://prcvzefynoiuneybufge.supabase.co',SB_KEY='sb_publishable_JbxZuf181uR8zbmTyyfFiA_2pLjsq0C',sb=supabase.createClient(SB_URL,SB_KEY),$=x=>document.getElementById(x);let uhid='';function makeUHID(){const d=new Date(),date=d.getFullYear().toString().slice(-2)+String(d.getMonth()+1).padStart(2,'0')+String(d.getDate()).padStart(2,'0');return 'PH-'+date+'-'+crypto.randomUUID().replace(/-/g,'').slice(0,6).toUpperCase()}function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}async function init(){let {data}=await sb.auth.getSession();if(!data.session){location.href='/app-v2.html';return}uhid=makeUHID();$('uhid').textContent=uhid}async function register(){let {data:{user}}=await sb.auth.getUser();if(!user)return;let name=$('name').value.trim(),age=$('age').value.trim(),gender=$('gender').value,mobile=$('mobile').value.trim();if(!name){$('status').innerHTML='<span class="error">Patient name is required.</span>';return}if(mobile){let {data:existing,error}=await sb.from('patients').select('id,name,patient_id').eq('doctor_id',user.id).eq('mobile',mobile).limit(1);if(error){$('status').innerHTML='<span class="error">'+esc(error.message)+'</span>';return}if(existing&&existing.length){$('status').innerHTML='<span class="error">A patient with this mobile number already exists: <b>'+esc(existing[0].name)+'</b> (UHID '+esc(existing[0].patient_id||'—')+'). Please use New Visit instead.</span>';return}}let {data:p,error}=await sb.from('patients').insert({doctor_id:user.id,patient_id:uhid,name,age:age?Number(age):null,gender,mobile}).select('id,patient_id').single();if(error){$('status').innerHTML='<span class="error">'+esc(error.message)+'</span>';return}sessionStorage.setItem('registered_patient_id',p.id);location.href='/new-visit.html?patient_id='+encodeURIComponent(p.id)}init();</script></body></html>
