<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Prime Hospital - Dashboard</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>*{box-sizing:border-box}body{font:14px Arial;margin:0;background:#f4f7fb;color:#172033}.wrap{max-width:1150px;margin:20px auto;padding:20px;background:#fff;border-radius:12px}.top{display:flex;justify-content:space-between;align-items:center;gap:12px}.btn{padding:10px 14px;border-radius:6px;border:1px solid #123d88;background:#fff;color:#123d88;font-weight:bold;text-decoration:none;cursor:pointer}.primary{background:#123d88;color:#fff}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:18px 0}.stat{border:1px solid #dfe5ee;border-radius:10px;padding:18px;background:#f8fbff}.num{font-size:28px;font-weight:bold;color:#123d88;margin-top:5px}.actions{display:flex;gap:8px;flex-wrap:wrap;margin:15px 0}.filter{display:flex;gap:8px;align-items:end;flex-wrap:wrap}.filter input{padding:9px;border:1px solid #cfd7e3;border-radius:6px}.card{border:1px solid #dfe5ee;border-radius:9px;padding:14px;margin:12px 0}.patient{display:flex;justify-content:space-between;gap:10px;align-items:center}.muted{color:#667085;font-size:12px}.error{color:#b42318}@media(max-width:700px){.grid{grid-template-columns:1fr}.top{flex-direction:column;align-items:flex-start}.patient{flex-direction:column;align-items:flex-start}}@media print{.noPrint{display:none!important}.wrap{margin:0}}
</style></head><body><main class="wrap"><div class="top"><div><h1 style="color:#123d88;margin:0">PRIME HOSPITAL</h1><div>OPD Dashboard</div></div><div class="actions noPrint"><a class="btn primary" href="/register-patient.html">+ New Patient</a><a class="btn" href="/new-visit.html">New Visit</a><a class="btn" href="/patients.html">Patient History</a><a class="btn" href="/daily-opd.html">Daily OPD</a><button class="btn" onclick="logout()">Logout</button></div></div><div id="status" class="muted">Loading...</div><div class="grid"><div class="stat">Total Patients<div id="patients" class="num">—</div></div><div class="stat">Today's Visits<div id="today" class="num">—</div></div><div class="stat">Total Visits<div id="visits" class="num">—</div></div></div><div class="card noPrint"><h2 style="color:#123d88;margin-top:0">OPD by Date</h2><div class="filter"><div><div class="muted">Select date</div><input id="date" type="date"></div><button class="btn primary" onclick="loadDate()">Show Visits</button><button class="btn" onclick="window.print()">Print List</button></div></div><div id="list"></div></main><script>const SB_URL='https://prcvzefynoiuneybufge.supabase.co',SB_KEY='sb_publishable_JbxZuf181uR8zbmTyyfFiA_2pLjsq0C',sb=supabase.createClient(SB_URL,SB_KEY),$=x=>document.getElementById(x);function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]) )}function today(){return new Date().toISOString().slice(0,10)}async function init(){let {data,error}=await sb.auth.getSession();if(error||!data.session){location.href='/app-v2.html';return}$('date').value=today();let user=data.session.user;let a=await sb.from('patients').select('*',{count:'exact',head:true}).eq('doctor_id',user.id);let b=await sb.from('visits').select('*',{count:'exact',head:true}).eq('doctor_id',user.id);let c=await sb.from('visits').select('*',{count:'exact',head:true}).eq('doctor_id',user.id).eq('visit_date',today());$('patients').textContent=a.count??'0';$('visits').textContent=b.count??'0';$('today').textContent=c.count??'0';if(a.error||b.error||c.error)$('status').innerHTML='<span class="error">'+esc((a.error||b.error||c.error).message)+'</span>';else $('status').textContent='Dashboard ready';loadDate()}async function loadDate(){let {data:{user}}=await sb.auth.getUser();if(!user)return;let d=$('date').value||today();let {data:vs,error}=await sb.from('visits').select('*').eq('doctor_id',user.id).eq('visit_date',d).order('id');if(error){$('list').innerHTML='<div class="card error">'+esc(error.message)+'</div>';return}vs=vs||[];if(!vs.length){$('list').innerHTML='<div class="card muted">No visits on '+esc(d)+'.</div>';return}let ids=[...new Set(vs.map(v=>v.patient_id))];let {data:ps}=await sb.from('patients').select('*').eq('doctor_id',user.id).in('id',ids);let map=Object.fromEntries((ps||[]).map(p=>[p.id,p]));$('list').innerHTML='<h2 style="color:#123d88">Visits on '+esc(d)+' ('+vs.length+')</h2>'+vs.map(v=>{let p=map[v.patient_id]||{};return `<div class="card"><div class="patient"><div><b style="font-size:17px;color:#123d88">${esc(p.name||'Unknown')}</b><div class="muted">UHID: ${esc(p.patient_id||'—')} • Mobile: ${esc(p.mobile||'—')} • ${esc(p.gender||'')} ${esc(p.age||'')}</div><div style="margin-top:7px"><b>Diagnosis:</b> ${esc(v.diagnosis||'—')}</div><div><b>Complaints:</b> ${esc(v.complaints||'—')}</div></div><div class="actions noPrint"><a class="btn" href="/patients.html">History</a><a class="btn primary" href="/new-visit.html?patient_id=${encodeURIComponent(p.id||'')}">New Visit</a></div></div></div>`}).join('')}async function logout(){await sb.auth.signOut();location.href='/app-v2.html'}init();</script></body></html>
