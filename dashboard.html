<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Prime Hospital - Dashboard</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>*{box-sizing:border-box}body{font:14px Arial;margin:0;background:#f4f7fb;color:#172033}.wrap{max-width:1150px;margin:20px auto;padding:20px}.head{background:#fff;border-radius:16px;padding:18px;display:flex;justify-content:space-between;align-items:center;gap:15px;box-shadow:0 3px 14px #123d8812}.brand{display:flex;align-items:center;gap:11px}.logo{width:48px;height:48px;border-radius:12px;background:#123d88;color:#fff;display:grid;place-items:center;font-size:25px;font-weight:bold}.brand h1{margin:0;color:#123d88;font-size:23px}.nav{display:flex;gap:7px;flex-wrap:wrap;margin-top:12px}.btn{padding:9px 12px;border-radius:7px;border:1px solid #123d88;background:#fff;color:#123d88;font-weight:bold;text-decoration:none;cursor:pointer}.primary{background:#123d88;color:#fff}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:18px 0}.stat{background:#fff;border:1px solid #dfe5ee;border-radius:12px;padding:18px}.num{font-size:28px;font-weight:bold;color:#123d88;margin-top:5px}.filter,.search{display:flex;gap:8px;align-items:end;flex-wrap:wrap}.filter input,.search input{padding:10px;border:1px solid #cfd7e3;border-radius:6px}.card{background:#fff;border:1px solid #dfe5ee;border-radius:10px;padding:14px;margin:12px 0}.patient{display:flex;justify-content:space-between;gap:10px;align-items:center}.muted{color:#667085;font-size:12px}.error{color:#b42318}.searchBox{background:#fff;border-radius:12px;padding:15px}.results .card{background:#f8fbff}@media(max-width:700px){.grid{grid-template-columns:1fr}.head{align-items:flex-start;flex-direction:column}.patient{flex-direction:column;align-items:flex-start}.search{display:grid;grid-template-columns:1fr}.filter{align-items:stretch}}@media print{.noPrint{display:none!important}.wrap{margin:0}}</style></head><body><main class="wrap"><header class="head"><div class="brand"><div class="logo">+</div><div><h1>PRIME HOSPITAL</h1><div class="muted">OPD Dashboard • Quality Treatment</div></div></div><div class="nav noPrint"><a class="btn primary" href="/home.html">⌂ Home</a><a class="btn" href="/app-v3.html">＋ New Visit</a><a class="btn" href="/patients.html">👥 Patients</a><a class="btn" href="/daily-opd.html">📅 Daily OPD</a><a class="btn" href="/medicines.html">💊 Medicines</a><a class="btn" href="/reports.html">📈 Reports</a><button class="btn" onclick="logout()">Logout</button></div></header><div id="status" class="muted" style="margin-top:12px">Loading...</div><div class="grid"><div class="stat">Total Patients<div id="patients" class="num">—</div></div><div class="stat">Today's Visits<div id="today" class="num">—</div></div><div class="stat">Total Visits<div id="visits" class="num">—</div></div></div><div class="searchBox noPrint"><h2 style="color:#123d88;margin-top:0">🔎 Find Patient</h2><div class="search"><input id="q" placeholder="Search name, mobile or UHID"><button class="btn primary" onclick="searchPatients()">Search</button><button class="btn" onclick="clearSearch()">Clear</button></div><div id="results" class="results"></div></div><div class="card noPrint"><h2 style="color:#123d88;margin-top:0">📅 OPD by Date</h2><div class="filter"><input id="date" type="date"><button class="btn primary" onclick="loadDate()">Show Visits</button><button class="btn" onclick="window.print()">Print List</button></div></div><div id="list"></div></main><script>const sb=supabase.createClient('https://prcvzefynoiuneybufge.supabase.co','sb_publishable_JbxZuf181uR8zbmTyyfFiA_2pLjsq0C'),$=x=>document.getElementById(x);function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}function today(){return new Date().toISOString().slice(0,10)}async function init(){let{data,error}=await sb.auth.getSession();if(error||!data.session){location.href='/app-v2.html';return}$('date').value=today();let user=data.session.user;let[a,b,c]=await Promise.all([sb.from('patients').select('*',{count:'exact',head:true}).eq('doctor_id',user.id),sb.from('visits').select('*',{count:'exact',head:true}).eq('doctor_id',user.id),sb.from('visits').select('*',{count:'exact',head:true}).eq('doctor_id',user.id).eq('visit_date',today())]);$('patients').textContent=a.count??'0';$('visits').textContent=b.count??'0';$('today').textContent=c.count??'0';$('status').textContent=(a.error||b.error||c.error)?(a.error||b.error||c.error).message:'Dashboard ready';loadDate()}async function searchPatients(){let{data:{user}}=await sb.auth.getUser(),q=$('q').value.trim();if(!q){$('results').innerHTML='<div class="muted">Enter name, mobile or UHID.</div>';return}let{data,error}=await sb.from('patients').select('*').eq('doctor_id',user.id).or('name.ilike.%'+q+'%,mobile.ilike.%'+q+'%,patient_id.ilike.%'+q+'%').order('name').limit(30);if(error)return $('results').innerHTML='<div class=error>'+esc(error.message)+'</div>';if(!data.length)return $('results').innerHTML='<div class=muted>No patient found.</div>';$('results').innerHTML=data.map(p=>`<div class=card><div class=patient><div><b style="font-size:17px;color:#123d88">${esc(p.name)}</b><div class=muted>UHID: ${esc(p.patient_id||'—')} • Age: ${esc(p.age||'—')} • ${esc(p.gender||'')} • Mobile: ${esc(p.mobile||'—')}</div></div><div class=nav><a class="btn primary" href="/patients.html">History</a><a class=btn href="/patient-timeline.html?patient_id=${encodeURIComponent(p.id)}">Timeline</a><a class=btn href="/app-v3.html?patient_id=${encodeURIComponent(p.id)}">New Visit</a></div></div></div>`).join('')}function clearSearch(){$('q').value='';$('results').innerHTML=''}async function loadDate(){let{data:{user}}=await sb.auth.getUser(),d=$('date').value||today(),{data:vs,error}=await sb.from('visits').select('*').eq('doctor_id',user.id).eq('visit_date',d).order('id');if(error)return $('list').innerHTML='<div class=card>'+esc(error.message)+'</div>';if(!vs?.length)return $('list').innerHTML='<div class="card muted">No visits on '+esc(d)+'.</div>';let ids=[...new Set(vs.map(v=>v.patient_id))],{data:ps}=await sb.from('patients').select('*').eq('doctor_id',user.id).in('id',ids),map=Object.fromEntries((ps||[]).map(p=>[p.id,p]));$('list').innerHTML='<h2 style="color:#123d88">Visits on '+esc(d)+' ('+vs.length+')</h2>'+vs.map(v=>{let p=map[v.patient_id]||{};return `<div class=card><div class=patient><div><b style="font-size:17px;color:#123d88">${esc(p.name||'Unknown')}</b><div class=muted>UHID: ${esc(p.patient_id||'—')} • Mobile: ${esc(p.mobile||'—')}</div><div><b>Diagnosis:</b> ${esc(v.diagnosis||'—')}</div></div><div class=nav><a class=btn href="/patients.html">History</a><a class="btn primary" href="/app-v3.html?patient_id=${encodeURIComponent(p.id||'')}">New Visit</a></div></div></div>`}).join('')}async function logout(){await sb.auth.signOut();location.href='/app-v3.html'}init();</script></body></html>
