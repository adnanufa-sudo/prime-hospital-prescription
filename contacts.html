<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Prime Hospital - Contacts Directory</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>body{font:14px Arial;margin:0;background:#f4f7fb;color:#172033}.wrap{max-width:950px;margin:20px auto;padding:20px;background:#fff;border-radius:12px}.top{display:flex;justify-content:space-between;gap:10px;align-items:center}.btn{padding:9px 13px;border-radius:6px;border:1px solid #123d88;background:#fff;color:#123d88;font-weight:bold;cursor:pointer;text-decoration:none}.primary{background:#123d88;color:#fff}.card{border:1px solid #dfe5ee;border-radius:9px;padding:14px;margin:12px 0}.fields{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}.field label{display:block;font-size:11px;font-weight:bold;margin-bottom:4px}.field input,.field select{width:100%;padding:9px;border:1px solid #cfd7e3;border-radius:6px}.table{width:100%;border-collapse:collapse;margin-top:15px}.table th,.table td{border-bottom:1px solid #e5e7eb;padding:9px;text-align:left}.muted{color:#667085;font-size:12px}@media(max-width:700px){.top{flex-direction:column;align-items:flex-start}.fields{grid-template-columns:1fr}.table{font-size:12px;display:block;overflow:auto}}</style></head><body><main class="wrap"><div class="top"><div><h1 style="color:#123d88;margin:0">PRIME HOSPITAL</h1><div>Directory & Advertisement Contacts</div></div><a class="btn" href="/dashboard.html">Dashboard</a></div><div class="card"><h2 style="color:#123d88;margin-top:0">Add Contact</h2><div class="fields"><div class="field"><label>Name / Organization</label><input id="name"></div><div class="field"><label>Phone Number</label><input id="phone"></div><div class="field"><label>Purpose</label><select id="type"><option>Directory</option><option>Advertisement</option><option>Referral</option><option>Supplier</option><option>Other</option></select></div></div><button class="btn primary" style="margin-top:10px" onclick="add()">Save Contact</button></div><div class="card"><h2 style="color:#123d88;margin-top:0">Saved Contacts</h2><input id="q" placeholder="Search contacts" oninput="render()" style="padding:9px;width:100%;border:1px solid #cfd7e3;border-radius:6px"><div id="list"></div></div></main><script>const KEY='prime_hospital_business_contacts';const $=x=>document.getElementById(x);function load(){try{return JSON.parse(localStorage.getItem(KEY)||'[]')}catch{return[]}}function save(x){localStorage.setItem(KEY,JSON.stringify(x))}function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}function add(){let name=$('name').value.trim(),phone=$('phone').value.trim(),type=$('type').value;if(!name||!phone)return;let a=load();a.push({id:crypto.randomUUID(),name,phone,type});save(a);$('name').value='';$('phone').value='';render()}function del(id){save(load().filter(x=>x.id!==id));render()}function render(){let q=$('q').value.toLowerCase().trim(),a=load().filter(x=>(x.name+' '+x.phone+' '+x.type).toLowerCase().includes(q));$('list').innerHTML=a.length?'<table class="table"><thead><tr><th>Name</th><th>Phone</th><th>Purpose</th><th></th></tr></thead><tbody>'+a.map(x=>`<tr><td>${esc(x.name)}</td><td><a href="tel:${esc(x.phone)}">${esc(x.phone)}</a></td><td>${esc(x.type)}</td><td><button class="btn" onclick="del('${x.id}')">Delete</button></td></tr>`).join('')+'</tbody></table>':'<div class="muted" style="margin-top:12px">No contacts saved.</div>'}render();</script></body></html>
