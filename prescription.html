<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Prime Hospital - Prescription</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>*{box-sizing:border-box}body{font:14px Arial;margin:0;background:#eef2f7;color:#172033}.sheet{max-width:850px;margin:20px auto;background:#fff;padding:34px;border-radius:6px;box-shadow:0 2px 12px #0001}.header{text-align:center;border-bottom:2px solid #123d88;padding-bottom:14px}.header h1{margin:0;color:#123d88;font-size:30px;letter-spacing:1px}.tag{font-weight:bold;margin-top:4px}.doctor{margin-top:6px}.patient{border:1px solid #cfd7e3;border-radius:7px;padding:12px;margin-top:18px;line-height:1.8}.grid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-top:14px}.vital{border:1px solid #d9e0e8;padding:8px;border-radius:5px}.section{margin-top:18px}.section h3{color:#123d88;border-bottom:1px solid #dfe5ee;padding-bottom:6px;margin-bottom:8px}.rx{width:100%;border-collapse:collapse}.rx th,.rx td{border:1px solid #bfc7d3;padding:9px;text-align:left}.rx th{background:#f3f6fa}.footer{margin-top:55px;text-align:right}.actions{text-align:center;margin-bottom:12px}.btn{padding:10px 16px;border:1px solid #123d88;border-radius:6px;background:#fff;color:#123d88;font-weight:bold;cursor:pointer}.muted{color:#667085;font-size:12px}.error{color:#b42318}@media(max-width:700px){.sheet{margin:0;padding:18px;border-radius:0}.grid{grid-template-columns:1fr 1fr}}@media print{body{background:#fff}.sheet{max-width:none;margin:0;padding:12mm;box-shadow:none}.actions{display:none!important}}
</style></head><body><main class="sheet"><div class="actions"><button class="btn" onclick="window.print()">Print Prescription</button> <button class="btn" onclick="window.close()">Close</button></div><div id="content"><div class="muted">Loading prescription...</div></div></main><script>const SB_URL='https://prcvzefynoiuneybufge.supabase.co',SB_KEY='sb_publishable_JbxZuf181uR8zbmTyyfFiA_2pLjsq0C',sb=supabase.createClient(SB_URL,SB_KEY);function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]) )}async function init(){let {data,error}=await sb.auth.getSession();if(error||!data.session){location.href='/app-v2.html';return}let user=data.session.user;let qs=new URLSearchParams(location.search),vid=qs.get('visit_id');if(!vid){$('content').innerHTML='<p class="error">Visit not specified.</p>';return}let {data:v,error:ve}=await sb.from('visits').select('*').eq('id',vid).eq('doctor_id',user.id).single();if(ve){$('content').innerHTML='<p class="error">'+esc(ve.message)+'</p>';return}let {data:p,error:pe}=await sb.from('patients').select('*').eq('id',v.patient_id).eq('doctor_id',user.id).single();if(pe){$('content').innerHTML='<p class="error">'+esc(pe.message)+'</p>';return}let {data:meds,error:me}=await sb.from('prescriptions').select('*').eq('visit_id',vid).order('sort_order');if(me){$('content').innerHTML='<p class="error">'+esc(me.message)+'</p>';return}let rows=(meds||[]).map((m,i)=>`<tr><td>${i+1}</td><td><b>${esc(m.medicine_name||'')}</b></td><td>${esc(m.strength||'—')}</td><td><b>${esc(m.frequency||'—')}</b></td></tr>`).join('')||'<tr><td colspan="4">No medicines prescribed.</td></tr>';$('content').innerHTML=`<div class="header"><h1>PRIME HOSPITAL</h1><div class="tag">Quality Treatment</div><div class="doctor">Dr. Adnan H Khan, MBBS</div></div><div class="patient"><b>Patient:</b> ${esc(p.name||'—')} &nbsp;&nbsp; <b>UHID:</b> ${esc(p.patient_id||'—')}<br><b>Age:</b> ${esc(p.age||'—')} &nbsp;&nbsp; <b>Gender:</b> ${esc(p.gender||'—')} &nbsp;&nbsp; <b>Mobile:</b> ${esc(p.mobile||'—')}<br><b>Visit Date:</b> ${esc(v.visit_date||'—')}</div><div class="grid"><div class="vital"><b>BP</b><br>${esc(v.bp||'—')}</div><div class="vital"><b>Pulse</b><br>${esc(v.pulse||'—')}</div><div class="vital"><b>SpO₂</b><br>${esc(v.spo2||'—')}</div><div class="vital"><b>Weight</b><br>${esc(v.weight||'—')}</div><div class="vital"><b>Sugar</b><br>${esc(v.blood_sugar||'—')}</div></div><div class="section"><h3>Complaints / Examination</h3>${esc(v.complaints||'—')}</div><div class="section"><h3>Diagnosis</h3>${esc(v.diagnosis||'—')}</div><div class="section"><h3>Prescription</h3><table class="rx"><thead><tr><th>No.</th><th>Brand Name</th><th>Formulation + Dosage</th><th>When to Take</th></tr></thead><tbody>${rows}</tbody></table></div><div class="section"><h3>Advice / Treatment</h3>${esc(v.advice||'—')}</div><div class="footer"><b>Doctor</b><br><br>________________________</div>`}const $=id=>document.getElementById(id);init();</script></body></html>
