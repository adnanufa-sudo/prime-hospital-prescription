Id('status').innerHTML='<span class="err">Backup failed: '+esc((p.error||v.error||r.error).message)+'</span>';return}let out={backup_created_at:new Date().toISOString(),doctor_id:user.id,patients:p.data||[],visits:v.data||[],prescriptions:r.data||[]};let blob=new Blob([JSON.stringify(out,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='prime-hospital-backup-'+new Date().toISOString().slice(0,10)+'.json';a.click();URL.revokeObjectURL(a.href);document.getElementById('status').innerHTML='<span class="ok">Backup downloaded successfully.</span>'}init();</script></body></html>
